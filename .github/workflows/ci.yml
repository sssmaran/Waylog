name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Format check
        run: |
          gofmt -l ./cmd ./internal ./pkg ./examples
          test -z "$(gofmt -l ./cmd ./internal ./pkg ./examples)"

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -timeout 120s ./...

      - name: Test SDK modules
        run: make test-sdk

      - name: Vet SDK modules
        run: make vet-sdk
