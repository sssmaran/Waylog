<!doctype html>
<html lang="en" style="color-scheme: dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Waylog Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0a0a0a;
        --bg-card: #111;
        --bg-elevated: #1a1a1a;
        --fg: #ededed;
        --fg-secondary: #888;
        --fg-muted: #666;
        --border: #333;
        --border-hover: #444;
        --blue: #0070f3;
        --red: #f31260;
        --green: #17c964;
        --amber: #f5a623;
        --radius-card: 8px;
        --radius-badge: 6px;
        --radius-inline: 4px;
        --shadow:
          0 0 0 1px rgba(255, 255, 255, 0.05), 0 4px 12px rgba(0, 0, 0, 0.4);
        --font-sans: "Geist", system-ui, -apple-system, sans-serif;
        --font-mono: "Geist Mono", "SF Mono", monospace;
      }
      html {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 1.5;
      }
      body {
        max-width: 1280px;
        margin: 0 auto;
        padding: 16px 24px 48px;
      }
      a {
        color: var(--blue);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      a:focus-visible,
      button:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
        border-radius: var(--radius-inline);
      }
      .skip-link {
        position: absolute;
        left: -9999px;
        top: 0;
        background: var(--blue);
        color: #fff;
        padding: 8px 16px;
        z-index: 100;
        border-radius: 0 0 var(--radius-inline) 0;
      }
      .skip-link:focus {
        left: 0;
      }
      h1 {
        font-size: 20px;
        font-weight: 500;
        margin-bottom: 4px;
      }
      h2 {
        font-size: 15px;
        font-weight: 500;
        color: var(--fg-secondary);
        margin-bottom: 16px;
        scroll-margin-top: 24px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }
      .header h1 {
        margin-bottom: 0;
      }
      .sampling-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        font-weight: 500;
        background: rgba(245, 166, 35, 0.15);
        color: var(--amber);
        padding: 2px 8px;
        border-radius: var(--radius-badge);
      }
      .last-update {
        font-size: 12px;
        color: var(--fg-muted);
        margin-left: auto;
        font-variant-numeric: tabular-nums;
        font-family: var(--font-mono);
      }

      /* KPI cards */
      .kpi-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin-bottom: 24px;
      }
      .kpi-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: 16px;
        box-shadow: var(--shadow);
        touch-action: manipulation;
        min-height: 80px;
      }
      .kpi-card .label {
        font-size: 12px;
        color: var(--fg-secondary);
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .kpi-card .value {
        font-size: 24px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        font-family: var(--font-mono);
      }
      .kpi-card .unit {
        font-size: 12px;
        color: var(--fg-muted);
        margin-left: 4px;
        font-weight: 400;
      }
      .kpi-card.skeleton .value {
        background: var(--bg-elevated);
        border-radius: var(--radius-inline);
        height: 28px;
        width: 80px;
      }
      .kpi-card.skeleton .label {
        background: var(--bg-elevated);
        border-radius: var(--radius-inline);
        height: 14px;
        width: 60px;
      }

      /* Chart */
      .chart-container {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: 16px;
        box-shadow: var(--shadow);
        margin-bottom: 24px;
        position: relative;
        height: 300px;
      }
      .chart-container canvas {
        width: 100% !important;
        height: 100% !important;
      }

      /* Tables */
      .table-wrap {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow);
        margin-bottom: 24px;
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        text-align: left;
        font-size: 12px;
        font-weight: 500;
        color: var(--fg-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }
      th:hover {
        color: var(--fg);
      }
      td {
        padding: 10px 16px;
        border-bottom: 1px solid rgba(51, 51, 51, 0.5);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      tr:last-child td {
        border-bottom: none;
      }
      tbody tr {
        touch-action: manipulation;
      }
      .num {
        text-align: right;
        font-family: var(--font-mono);
        font-size: 13px;
      }
      .ellipsis {
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }

      /* Status badge */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        font-weight: 500;
        padding: 2px 8px;
        border-radius: var(--radius-badge);
        min-height: 24px;
      }
      .badge-success {
        background: rgba(23, 201, 100, 0.12);
        color: var(--green);
      }
      .badge-error {
        background: rgba(243, 18, 96, 0.12);
        color: var(--red);
      }
      .badge-warn {
        background: rgba(245, 166, 35, 0.12);
        color: var(--amber);
      }

      /* Empty state */
      .empty {
        padding: 32px;
        text-align: center;
        color: var(--fg-muted);
        font-size: 13px;
      }

      /* Modal */
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 50;
        align-items: center;
        justify-content: center;
        overscroll-behavior: contain;
      }
      .modal-overlay.open {
        display: flex;
      }
      .modal {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        max-width: 680px;
        width: calc(100% - 48px);
        max-height: 80vh;
        overflow-y: auto;
        padding: 24px;
      }
      .modal h3 {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .modal-close {
        background: none;
        border: 1px solid var(--border);
        border-radius: var(--radius-inline);
        color: var(--fg-secondary);
        cursor: pointer;
        padding: 4px 10px;
        font-size: 13px;
        min-width: 24px;
        min-height: 24px;
        touch-action: manipulation;
      }
      .modal-close:hover {
        color: var(--fg);
        border-color: var(--border-hover);
      }

      /* Hop chain */
      .hop-chain {
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      .hop {
        position: relative;
        padding: 12px 16px 12px 32px;
        border-left: 2px solid var(--border);
        margin-left: 8px;
      }
      .hop::before {
        content: "";
        position: absolute;
        left: -5px;
        top: 16px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
        border: 2px solid var(--bg-card);
      }
      .hop.fail::before {
        background: var(--red);
      }
      .hop.fail {
        background: rgba(243, 18, 96, 0.05);
        border-radius: var(--radius-inline);
      }
      .hop.root-cause {
        background: rgba(243, 18, 96, 0.1);
        border-left-color: var(--red);
      }
      .hop .hop-service {
        font-weight: 500;
        margin-bottom: 2px;
      }
      .hop .hop-detail {
        font-size: 12px;
        color: var(--fg-secondary);
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }
      .hop .hop-error {
        font-size: 12px;
        color: var(--red);
        margin-top: 2px;
      }

      .context-panel {
        margin-top: 16px;
        padding: 12px;
        background: var(--bg-elevated);
        border-radius: var(--radius-inline);
        font-size: 13px;
      }
      .context-panel dt {
        color: var(--fg-secondary);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-top: 8px;
      }
      .context-panel dt:first-child {
        margin-top: 0;
      }
      .context-panel dd {
        color: var(--fg);
        font-family: var(--font-mono);
        font-size: 12px;
        margin-left: 0;
      }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
      @media not (prefers-reduced-motion: reduce) {
        .kpi-card {
          transition:
            transform 0.15s ease,
            border-color 0.15s ease;
        }
        .kpi-card:hover {
          transform: translateY(-1px);
          border-color: var(--border-hover);
        }
        tbody tr {
          transition: background 0.1s ease;
        }
        tbody tr:hover {
          background: var(--bg-elevated);
        }
      }
    </style>
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>

    <div class="header">
      <h1>Waylog Dashboard</h1>
      <span
        id="sampling-badge"
        class="sampling-badge"
        style="display: none"
        aria-label="Data is sampled"
      >
        <span aria-hidden="true">&#9888;</span> Sampled
      </span>
      <span class="last-update" id="last-update" aria-live="polite"></span>
    </div>

    <main id="main">
      <!-- KPI Cards -->
      <section aria-label="Key metrics">
        <h2 id="kpi-heading" style="scroll-margin-top: 24px">Overview</h2>
        <div class="kpi-row" id="kpi-row">
          <div
            class="kpi-card skeleton"
            tabindex="0"
            aria-label="Total requests"
          >
            <div class="label">&nbsp;</div>
            <div class="value"></div>
          </div>
          <div class="kpi-card skeleton" tabindex="0" aria-label="Error rate">
            <div class="label">&nbsp;</div>
            <div class="value"></div>
          </div>
          <div class="kpi-card skeleton" tabindex="0" aria-label="P50 latency">
            <div class="label">&nbsp;</div>
            <div class="value"></div>
          </div>
          <div class="kpi-card skeleton" tabindex="0" aria-label="P95 latency">
            <div class="label">&nbsp;</div>
            <div class="value"></div>
          </div>
          <div class="kpi-card skeleton" tabindex="0" aria-label="P99 latency">
            <div class="label">&nbsp;</div>
            <div class="value"></div>
          </div>
        </div>
      </section>

      <!-- Time-series chart -->
      <section aria-label="Request and error rate chart">
        <h2 style="scroll-margin-top: 24px">Traffic (1h)</h2>
        <div class="chart-container">
          <canvas
            id="ts-chart"
            role="img"
            aria-label="Time-series chart of requests and error rate"
          ></canvas>
        </div>
      </section>

      <!-- Routes table -->
      <section aria-label="Routes">
        <h2 style="scroll-margin-top: 24px">
          Routes
          <span style="font-weight: 400; color: var(--fg-muted)">(5m)</span>
        </h2>
        <div class="table-wrap">
          <table id="routes-table">
            <thead>
              <tr>
                <th>Service</th>
                <th>Route</th>
                <th class="num">Invocations</th>
                <th class="num">Errors</th>
                <th class="num">Error Rate</th>
                <th class="num">2xx</th>
                <th class="num">4xx</th>
                <th class="num">5xx</th>
                <th class="num">P75 (ms)</th>
              </tr>
            </thead>
            <tbody id="routes-body">
              <tr>
                <td colspan="9" class="empty">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Recent traces table -->
      <section aria-label="Recent traces">
        <h2 style="scroll-margin-top: 24px">
          Recent Traces
          <span
            id="traces-context"
            style="font-weight: 400; color: var(--fg-muted)"
          ></span>
        </h2>
        <div class="table-wrap">
          <table id="traces-table">
            <thead>
              <tr>
                <th>Trace ID</th>
                <th id="traces-service-th" style="display: none">
                  Entry Service
                </th>
                <th>Event</th>
                <th>Status</th>
                <th class="num">Latency (ms)</th>
                <th>Time</th>
              </tr>
            </thead>
            <tbody id="traces-body">
              <tr>
                <td colspan="5" class="empty">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- Trace drilldown modal -->
    <div
      class="modal-overlay"
      id="modal-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <div class="modal" id="modal">
        <h3>
          <span id="modal-title">Trace Details</span
          ><button class="modal-close" id="modal-close" aria-label="Close">
            Esc
          </button>
        </h3>
        <div id="modal-body"></div>
      </div>
    </div>

    <script src="chart.umd.min.js"></script>
    <script>
      (function () {
        "use strict";

        const nf = new Intl.NumberFormat();
        const pf = new Intl.NumberFormat(undefined, {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
        const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });

        function relTime(ts) {
          const d = Date.now() - new Date(ts).getTime();
          if (d < 60000) return rtf.format(-Math.round(d / 1000), "second");
          if (d < 3600000) return rtf.format(-Math.round(d / 60000), "minute");
          return rtf.format(-Math.round(d / 3600000), "hour");
        }

        function statusBadge(code, success) {
          if (success)
            return (
              '<span class="badge badge-success" aria-label="Success"><span aria-hidden="true">&#10003;</span> ' +
              code +
              "</span>"
            );
          if (code >= 500)
            return (
              '<span class="badge badge-error" aria-label="Server error"><span aria-hidden="true">&#10007;</span> ' +
              code +
              "</span>"
            );
          if (code >= 400)
            return (
              '<span class="badge badge-warn" aria-label="Client error"><span aria-hidden="true">&#9888;</span> ' +
              code +
              "</span>"
            );
          return (
            '<span class="badge badge-success" aria-label="Success"><span aria-hidden="true">&#10003;</span> ' +
            code +
            "</span>"
          );
        }

        let tsChart = null;
        let lastTriggerEl = null;

        // --- Data fetching ---

        async function fetchJSON(url) {
          const r = await fetch(url);
          if (!r.ok) throw new Error(r.statusText);
          return r.json();
        }

        function showSampled(sampled) {
          document.getElementById("sampling-badge").style.display = sampled
            ? "inline-flex"
            : "none";
        }

        async function refreshKPIs() {
          try {
            const data = await fetchJSON(
              "/v1/overview/timeseries?window=5m&step=5m",
            );
            showSampled(data.sampled);
            const b = data.buckets;
            const last = b.length > 0 ? b[b.length - 1] : null;
            const row = document.getElementById("kpi-row");
            if (!last || last.total === 0) {
              row.innerHTML =
                kpiCard("Requests", "0", "") +
                kpiCard("Error Rate", "0", "%") +
                kpiCard("P50", "—", "ms") +
                kpiCard("P95", "—", "ms") +
                kpiCard("P99", "—", "ms");
              return;
            }
            row.innerHTML =
              kpiCard("Requests", nf.format(last.total), "") +
              kpiCard("Error Rate", pf.format(last.error_rate), "%") +
              kpiCard("P50", nf.format(last.p50), "ms") +
              kpiCard("P95", nf.format(last.p95), "ms") +
              kpiCard("P99", nf.format(last.p99), "ms");
          } catch (e) {
            console.error("KPI fetch error:", e);
          }
        }

        function kpiCard(label, value, unit) {
          return (
            '<div class="kpi-card" tabindex="0" aria-label="' +
            label +
            ": " +
            value +
            unit +
            '"><div class="label">' +
            label +
            '</div><div class="value">' +
            value +
            '<span class="unit">' +
            unit +
            "</span></div></div>"
          );
        }

        async function refreshChart() {
          try {
            const data = await fetchJSON(
              "/v1/overview/timeseries?window=1h&step=5m",
            );
            const labels = data.buckets.map(function (b) {
              return new Date(b.start).toLocaleTimeString(undefined, {
                hour: "2-digit",
                minute: "2-digit",
              });
            });
            const totals = data.buckets.map(function (b) {
              return b.total;
            });
            const errRates = data.buckets.map(function (b) {
              return b.error_rate;
            });

            if (tsChart) {
              tsChart.data.labels = labels;
              tsChart.data.datasets[0].data = totals;
              tsChart.data.datasets[1].data = errRates;
              tsChart.update("none");
              return;
            }

            const ctx = document.getElementById("ts-chart").getContext("2d");
            tsChart = new Chart(ctx, {
              type: "line",
              data: {
                labels: labels,
                datasets: [
                  {
                    label: "Requests",
                    data: totals,
                    borderColor: "#0070f3",
                    backgroundColor: "rgba(0,112,243,0.1)",
                    fill: true,
                    tension: 0.3,
                    yAxisID: "y",
                    pointRadius: 2,
                    pointHoverRadius: 4,
                  },
                  {
                    label: "Error Rate %",
                    data: errRates,
                    borderColor: "#f5a623",
                    backgroundColor: "transparent",
                    borderDash: [4, 4],
                    tension: 0.3,
                    yAxisID: "y1",
                    pointRadius: 2,
                    pointHoverRadius: 4,
                  },
                ],
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { intersect: false, mode: "index" },
                plugins: {
                  legend: {
                    labels: {
                      color: "#888",
                      font: { family: "'Geist',sans-serif", size: 12 },
                    },
                  },
                  tooltip: {
                    backgroundColor: "#1a1a1a",
                    borderColor: "#333",
                    borderWidth: 1,
                    titleColor: "#ededed",
                    bodyColor: "#ededed",
                    bodyFont: { family: "'Geist Mono',monospace" },
                    titleFont: { family: "'Geist',sans-serif" },
                  },
                },
                scales: {
                  x: {
                    ticks: {
                      color: "#666",
                      font: { family: "'Geist',sans-serif", size: 11 },
                    },
                    grid: { color: "rgba(51,51,51,0.5)" },
                  },
                  y: {
                    type: "linear",
                    position: "left",
                    title: {
                      display: true,
                      text: "Requests",
                      color: "#888",
                      font: { family: "'Geist',sans-serif" },
                    },
                    ticks: {
                      color: "#666",
                      font: { family: "'Geist Mono',monospace", size: 11 },
                    },
                    grid: { color: "rgba(51,51,51,0.5)" },
                    beginAtZero: true,
                  },
                  y1: {
                    type: "linear",
                    position: "right",
                    title: {
                      display: true,
                      text: "Error Rate %",
                      color: "#888",
                      font: { family: "'Geist',sans-serif" },
                    },
                    ticks: {
                      color: "#666",
                      font: { family: "'Geist Mono',monospace", size: 11 },
                    },
                    grid: { drawOnChartArea: false },
                    beginAtZero: true,
                    suggestedMax: 100,
                  },
                },
              },
            });
          } catch (e) {
            console.error("Chart fetch error:", e);
          }
        }

        async function refreshRoutes() {
          try {
            const data = await fetchJSON("/v1/routes?window=5m");
            const tbody = document.getElementById("routes-body");
            if (!data.routes || data.routes.length === 0) {
              tbody.innerHTML =
                '<tr><td colspan="9" class="empty">No routes in the last 5 minutes</td></tr>';
              return;
            }
            tbody.innerHTML = data.routes
              .map(function (r) {
                return (
                  "<tr>" +
                  '<td class="ellipsis">' +
                  esc(r.service) +
                  "</td>" +
                  '<td class="ellipsis">' +
                  esc(r.route) +
                  "</td>" +
                  '<td class="num">' +
                  nf.format(r.invocations) +
                  "</td>" +
                  '<td class="num">' +
                  nf.format(r.errors) +
                  "</td>" +
                  '<td class="num">' +
                  pf.format(r.error_rate) +
                  "%</td>" +
                  '<td class="num">' +
                  nf.format(r.status_2xx) +
                  "</td>" +
                  '<td class="num">' +
                  nf.format(r.status_4xx) +
                  "</td>" +
                  '<td class="num">' +
                  nf.format(r.status_5xx) +
                  "</td>" +
                  '<td class="num">' +
                  nf.format(r.p75_latency_ms) +
                  "</td>" +
                  "</tr>"
                );
              })
              .join("");
          } catch (e) {
            console.error("Routes fetch error:", e);
          }
        }

        async function refreshTraces() {
          try {
            const data = await fetchJSON("/v1/traces/recent?limit=20");
            const tbody = document.getElementById("traces-body");
            const serviceHeader = document.getElementById("traces-service-th");
            const tracesContext = document.getElementById("traces-context");
            const traces = Array.isArray(data) ? data : [];
            const uniqueServices = new Set();
            traces.forEach(function (t) {
              const svc = typeof t.service === "string" ? t.service.trim() : "";
              if (svc) uniqueServices.add(svc);
            });
            const showServiceColumn = uniqueServices.size > 1;
            const singleService =
              uniqueServices.size === 1 ? Array.from(uniqueServices)[0] : "";
            serviceHeader.style.display = showServiceColumn ? "" : "none";
            tracesContext.textContent =
              showServiceColumn || !singleService
                ? ""
                : "Entry Service: " + singleService;
            const colspan = showServiceColumn ? 6 : 5;

            if (traces.length === 0) {
              tbody.innerHTML =
                '<tr><td colspan="' +
                colspan +
                '" class="empty">No traces yet</td></tr>';
              return;
            }
            tbody.innerHTML = traces
              .map(function (t) {
                const traceId =
                  typeof t.trace_id === "string" ? t.trace_id : "";
                const service =
                  typeof t.service === "string" ? t.service.trim() : "";
                const serviceForLabel = service || singleService;
                const ariaLabel =
                  !showServiceColumn && serviceForLabel
                    ? "Trace " + traceId + ", entry service " + serviceForLabel
                    : "Trace " + traceId;
                const serviceCell = showServiceColumn
                  ? '<td class="ellipsis">' + esc(service || "—") + "</td>"
                  : "";
                return (
                  "<tr>" +
                  '<td class="ellipsis"><a href="#trace-' +
                  esc(traceId) +
                  '" class="trace-link" data-trace="' +
                  esc(traceId) +
                  '" aria-label="' +
                  esc(ariaLabel) +
                  '" style="font-family:var(--font-mono);font-size:12px">' +
                  esc(traceId.substring(0, 16)) +
                  "&hellip;</a></td>" +
                  serviceCell +
                  '<td class="ellipsis">' +
                  esc(t.event_name || "—") +
                  "</td>" +
                  "<td>" +
                  statusBadge(t.status_code, t.success) +
                  "</td>" +
                  '<td class="num" style="font-family:var(--font-mono)">' +
                  nf.format(t.latency_ms) +
                  "</td>" +
                  '<td style="color:var(--fg-muted);font-size:12px">' +
                  relTime(t.timestamp) +
                  "</td>" +
                  "</tr>"
                );
              })
              .join("");
          } catch (e) {
            console.error("Traces fetch error:", e);
          }
        }

        function esc(s) {
          if (!s) return "";
          var d = document.createElement("div");
          d.appendChild(document.createTextNode(s));
          return d.innerHTML;
        }

        // --- Trace drilldown modal ---

        async function openTrace(traceId, triggerEl) {
          lastTriggerEl = triggerEl;
          const overlay = document.getElementById("modal-overlay");
          const body = document.getElementById("modal-body");
          document.getElementById("modal-title").textContent =
            "Trace " + traceId.substring(0, 16) + "\u2026";
          body.innerHTML = '<div class="empty">Loading...</div>';
          overlay.classList.add("open");
          document.getElementById("modal-close").focus();

          try {
            const data = await fetchJSON(
              "/v1/traces/story?trace_id=" + encodeURIComponent(traceId),
            );
            var html = "";

            // Hop chain
            if (data.story && data.story.chain && data.story.chain.length > 0) {
              html += '<div class="hop-chain">';
              var firstFailIdx = -1;
              if (data.story.first_fail_hop) {
                for (var i = 0; i < data.story.chain.length; i++) {
                  if (
                    data.story.chain[i].span_id ===
                    data.story.first_fail_hop.span_id
                  ) {
                    firstFailIdx = i;
                    break;
                  }
                }
              }
              data.story.chain.forEach(function (hop, idx) {
                var cls = "hop";
                if (!hop.success) cls += " fail";
                if (idx === firstFailIdx) cls += " root-cause";
                html += '<div class="' + cls + '">';
                html +=
                  '<div class="hop-service">' +
                  esc(hop.service || "unknown") +
                  (hop.is_root
                    ? ' <span style="color:var(--fg-muted);font-size:11px">(root)</span>'
                    : "") +
                  "</div>";
                html +=
                  '<div class="hop-detail">' +
                  hop.status_code +
                  " &middot; " +
                  nf.format(hop.latency_ms) +
                  "ms</div>";
                if (hop.error_code)
                  html +=
                    '<div class="hop-error">' + esc(hop.error_code) + "</div>";
                html += "</div>";
              });
              html += "</div>";
            } else {
              html += '<div class="empty">No hops found</div>';
            }

            // Context panel
            if (data.context) {
              var c = data.context;
              html += '<div class="context-panel"><dl>';
              if (c.user_id)
                html += "<dt>User</dt><dd>" + esc(c.user_id) + "</dd>";
              if (c.user_tier)
                html += "<dt>Tier</dt><dd>" + esc(c.user_tier) + "</dd>";
              if (c.flow) html += "<dt>Flow</dt><dd>" + esc(c.flow) + "</dd>";
              if (c.error_codes && c.error_codes.length)
                html +=
                  "<dt>Error Codes</dt><dd>" +
                  c.error_codes.map(esc).join(", ") +
                  "</dd>";
              if (c.flags && c.flags.length)
                html +=
                  "<dt>Flags</dt><dd>" + c.flags.map(esc).join(", ") + "</dd>";
              html += "</dl></div>";
            }

            body.innerHTML = html;
          } catch (e) {
            body.innerHTML =
              '<div class="empty">Failed to load trace: ' +
              esc(e.message) +
              "</div>";
          }
        }

        function closeModal() {
          document.getElementById("modal-overlay").classList.remove("open");
          if (lastTriggerEl) {
            lastTriggerEl.focus();
            lastTriggerEl = null;
          }
        }

        document
          .getElementById("modal-close")
          .addEventListener("click", closeModal);
        document
          .getElementById("modal-overlay")
          .addEventListener("click", function (e) {
            if (e.target === this) closeModal();
          });
        document.addEventListener("keydown", function (e) {
          if (
            e.key === "Escape" &&
            document.getElementById("modal-overlay").classList.contains("open")
          ) {
            closeModal();
          }
        });

        // Focus trap inside modal
        document
          .getElementById("modal")
          .addEventListener("keydown", function (e) {
            if (e.key !== "Tab") return;
            var focusable = this.querySelectorAll(
              'button, [href], [tabindex]:not([tabindex="-1"])',
            );
            if (focusable.length === 0) return;
            var first = focusable[0],
              last = focusable[focusable.length - 1];
            if (e.shiftKey && document.activeElement === first) {
              e.preventDefault();
              last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
              e.preventDefault();
              first.focus();
            }
          });

        // Trace link click handler (delegated)
        document.addEventListener("click", function (e) {
          var link = e.target.closest(".trace-link");
          if (!link) return;
          e.preventDefault();
          openTrace(link.dataset.trace, link);
        });

        // --- Init & auto-refresh ---

        function refreshAll() {
          refreshKPIs();
          refreshChart();
          refreshRoutes();
          refreshTraces();
          document.getElementById("last-update").textContent =
            "Updated " + new Date().toLocaleTimeString();
        }

        refreshAll();
        setInterval(refreshAll, 10000);
      })();
    </script>
  </body>
</html>
