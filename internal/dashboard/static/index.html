<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#231F1C" id="theme-color-meta" />
    <title>Crux Triage</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("waylog-dashboard-theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var meta = document.getElementById("theme-color-meta");
          if (meta)
            meta.setAttribute(
              "content",
              theme === "light" ? "#f6f8fb" : "#231F1C",
            );
        } catch (_) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #231F1C;
        --bg-2: #080808;
        --panel: #0c0c0c;
        --panel-2: #121212;
        --line: #1c1c1c;
        --line-strong: #2a2a2a;
        --text: #f5f0e6;
        --muted: #9a958a;
        --faint: #5d5851;
        --danger: #f87171;
        --danger-soft: rgba(248, 113, 113, 0.18);
        --warn: #fbbf24;
        --warn-soft: rgba(251, 191, 36, 0.18);
        --ok: #5eff8b;
        --ok-soft: rgba(94, 255, 139, 0.18);
        --info: #60a5fa;
        --info-soft: rgba(96, 165, 250, 0.18);
        --accent: #FF7300;
        --accent-bright: #FF7300;
        --accent-soft: rgba(255, 115, 0, 0.18);
        --control-bg: transparent;
        --control-hover: #141414;
        --row-bg: #0c0c0c;
        --row-hover: #141414;
        --item-bg: #0c0c0c;
        --active-text: #231F1C;
        --active-bg: var(--accent-bright);
        --link-hover: var(--text);
        --shadow: none;
        --radius-xl: 10px;
        --radius-lg: 8px;
        --radius-md: 6px;
        --bracket-len: 12px;
        --bracket-thick: 1.5px;
        --font-sans:
          "Geist", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        --font-mono: "Geist Mono", "SF Mono", Consolas, monospace;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #ece7da;
        --bg-2: #e3ddcc;
        --panel: #f4efe1;
        --panel-2: #ede7d6;
        --line: #cdc6b4;
        --line-strong: #a8a18d;
        --text: #0a0a0a;
        --muted: #585448;
        --faint: #8a8473;
        --danger: #b42318;
        --danger-soft: rgba(180, 35, 24, 0.14);
        --warn: #b45309;
        --warn-soft: rgba(180, 83, 9, 0.16);
        --ok: #15803d;
        --ok-soft: rgba(34, 197, 94, 0.18);
        --info: #1d4ed8;
        --info-soft: rgba(29, 78, 216, 0.12);
        --accent: #FF7300;
        --accent-bright: #FF7300;
        --accent-soft: rgba(255, 115, 0, 0.18);
        --control-bg: transparent;
        --control-hover: #ede7d6;
        --row-bg: #f4efe1;
        --row-hover: #ede7d6;
        --item-bg: #f4efe1;
        --active-text: #231F1C;
        --active-bg: var(--accent-bright);
        --link-hover: var(--text);
        --shadow: none;
      }

      * {
        box-sizing: border-box;
      }
      html {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        min-height: 100vh;
        margin: 0;
        padding: max(28px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(64px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
      }
      a {
        color: inherit;
        text-decoration: none;
        transition: color 0.15s ease;
      }
      a:hover {
        color: var(--link-hover);
      }
      button,
      select {
        height: 36px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--control-bg);
        color: var(--text);
        font: 500 0.82rem/1 var(--font-sans);
        letter-spacing: -0.005em;
        transition:
          border-color 0.15s ease,
          background 0.15s ease,
          color 0.15s ease;
      }
      button {
        cursor: pointer;
        touch-action: manipulation;
      }
      select {
        padding: 0 32px 0 12px;
      }
      button:hover,
      select:hover {
        border-color: var(--text);
        background: var(--control-hover);
      }
      a:focus-visible,
      button:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--accent-bright);
        outline-offset: 2px;
      }
      .skip {
        position: absolute;
        left: 18px;
        top: 12px;
        z-index: 10;
        transform: translateY(-180%);
        border-radius: var(--radius-md);
        background: var(--text);
        color: var(--bg);
        padding: 8px 12px;
        font-size: 0.82rem;
        font-weight: 500;
      }
      .skip:focus-visible {
        transform: translateY(0);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }
      .app {
        width: min(1180px, 100%);
        margin: 0 auto;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 8px 0 22px;
        border-bottom: 1px dashed var(--line);
      }
      .brand {
        display: inline-flex;
        align-items: baseline;
        gap: 8px;
        font-family: var(--font-mono);
        font-size: 0.82rem;
      }
      .brand .name {
        color: var(--text);
        font-weight: 600;
        font-family: var(--font-sans);
        font-size: 0.98rem;
        letter-spacing: -0.02em;
      }
      .brand .div {
        color: var(--faint);
      }
      .brand .ctx {
        color: var(--muted);
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .eyebrow .num {
        color: var(--text);
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent-bright);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .page-intro {
        margin: 26px 0 28px;
        color: var(--muted);
        font-size: 1rem;
        max-width: 60ch;
        line-height: 1.55;
      }
      h1 {
        margin: 14px 0 0;
        font-size: clamp(1.7rem, 3.4vw, 2.4rem);
        line-height: 1.05;
        font-weight: 600;
        letter-spacing: -0.045em;
        text-wrap: balance;
        max-width: 22ch;
      }
      .tagline {
        margin-top: 14px;
        color: var(--muted);
        font-size: 0.98rem;
        max-width: 56ch;
        line-height: 1.55;
      }
      .top-actions {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .last-updated {
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 0.74rem;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        margin-right: 4px;
      }
      .topbar-link {
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 0.74rem;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        text-decoration: none;
        margin-right: 4px;
      }
      .topbar-link:hover {
        color: var(--text);
        text-decoration: underline;
      }
      .icon-btn {
        width: 36px;
        height: 36px;
        padding: 0;
        display: inline-grid;
        place-items: center;
        color: var(--muted);
      }
      .icon-btn:hover {
        color: var(--text);
      }
      .icon-btn svg {
        display: block;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 28px;
      }
      .card {
        position: relative;
        border: 1px solid var(--line);
        border-radius: 0;
        background: var(--panel);
        box-shadow: var(--shadow);
      }
      /* tensorlake-style L-shaped corner brackets — opt in with `.bracketed` */
      .bracketed {
        position: relative;
      }
      .bracketed::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(var(--accent-bright), var(--accent-bright)) top left
            no-repeat,
          linear-gradient(var(--accent-bright), var(--accent-bright)) top left
            no-repeat,
          linear-gradient(var(--accent-bright), var(--accent-bright)) top right
            no-repeat,
          linear-gradient(var(--accent-bright), var(--accent-bright)) top right
            no-repeat,
          linear-gradient(var(--accent-bright), var(--accent-bright)) bottom
            left no-repeat,
          linear-gradient(var(--accent-bright), var(--accent-bright)) bottom
            left no-repeat,
          linear-gradient(var(--accent-bright), var(--accent-bright)) bottom
            right no-repeat,
          linear-gradient(var(--accent-bright), var(--accent-bright)) bottom
            right no-repeat;
        background-size:
          var(--bracket-len) var(--bracket-thick),
          var(--bracket-thick) var(--bracket-len),
          var(--bracket-len) var(--bracket-thick),
          var(--bracket-thick) var(--bracket-len),
          var(--bracket-len) var(--bracket-thick),
          var(--bracket-thick) var(--bracket-len),
          var(--bracket-len) var(--bracket-thick),
          var(--bracket-thick) var(--bracket-len);
      }
      .kpi {
        position: relative;
        min-height: 84px;
        overflow: hidden;
        padding: 14px 16px 12px;
      }
      .kpi .label {
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 0.66rem;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .kpi .value {
        margin-top: 8px;
        font-family: var(--font-mono);
        font-size: 1.4rem;
        font-weight: 500;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }
      .kpi .sub {
        margin-top: 4px;
        color: var(--faint);
        font-size: 0.72rem;
      }
      .spark {
        position: absolute;
        right: 12px;
        top: 12px;
        width: 38%;
        max-width: 80px;
        height: 28px;
        opacity: 0.85;
      }
      .spark path.area {
        fill: var(--accent-soft);
      }
      .spark path.line {
        fill: none;
        stroke: var(--accent-bright);
        stroke-width: 1.5;
        vector-effect: non-scaling-stroke;
      }
      .spark.latency path.area {
        fill: var(--info-soft);
      }
      .spark.latency path.line {
        stroke: var(--info);
      }
      .shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 10px;
        align-items: start;
      }
      .panel {
        padding: 20px;
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 16px;
      }
      .panel-title {
        margin: 0;
        font-size: 0.98rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .panel-sub {
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .route-tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 0 0 18px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        padding: 0 11px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.01em;
        transition:
          border-color 0.15s ease,
          color 0.15s ease,
          background 0.15s ease;
      }
      .pill:hover {
        color: var(--text);
        border-color: var(--line-strong);
      }
      .pill.active {
        color: var(--active-text);
        border-color: var(--active-bg);
        background: var(--active-bg);
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 6px;
      }
      th {
        color: var(--faint);
        font-family: var(--font-mono);
        font-size: 0.68rem;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-align: left;
        text-transform: uppercase;
        padding: 0 12px 6px;
      }
      td {
        background: var(--row-bg);
        border-bottom: 1px solid var(--line);
        border-top: 1px solid var(--line);
        padding: 13px 12px;
        vertical-align: middle;
        transition: background 0.15s ease;
      }
      td:first-child {
        border-left: 1px solid var(--line);
        border-radius: var(--radius-md) 0 0 var(--radius-md);
      }
      td:last-child {
        border-right: 1px solid var(--line);
        border-radius: 0 var(--radius-md) var(--radius-md) 0;
      }
      tr:hover td {
        background: var(--row-hover);
      }
      .mono {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }
      .muted {
        color: var(--muted);
      }
      .faint {
        color: var(--faint);
      }
      .status {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 22px;
        padding: 0 7px;
        border-radius: 3px;
        font-family: var(--font-mono);
        font-size: 0.7rem;
        font-weight: 500;
        letter-spacing: 0.03em;
        text-transform: lowercase;
      }
      .status.ok {
        color: var(--ok);
        background: var(--ok-soft);
      }
      .status.error,
      .status.timeout,
      .status.partial,
      .status.aborted,
      .status.missing,
      .status.critical {
        color: var(--danger);
        background: var(--danger-soft);
      }
      .status.suppressed,
      .status.warning {
        color: var(--warn);
        background: var(--warn-soft);
      }
      .family {
        display: grid;
        gap: 4px;
      }
      .family strong {
        font-family: var(--font-mono);
        font-size: 0.88rem;
        font-weight: 500;
        word-break: break-word;
      }
      .family .muted {
        font-size: 0.78rem;
      }
      .samples {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .sample-link {
        color: var(--text);
        font-family: var(--font-mono);
        font-size: 0.74rem;
        border-bottom: 1px dashed var(--line-strong);
        padding-bottom: 1px;
      }
      .sample-link:hover {
        color: var(--accent-bright);
        border-bottom-color: var(--accent-bright);
      }
      .story-grid {
        display: grid;
        gap: 12px;
      }
      .hero {
        position: relative;
        display: grid;
        gap: 8px;
        padding: 22px;
        border: 1px solid var(--danger-soft);
        border-radius: 0;
        background: var(--panel-2);
      }
      .hero::before {
        content: "";
        position: absolute;
        inset: -1px;
        pointer-events: none;
        background:
          linear-gradient(var(--danger), var(--danger)) top left no-repeat,
          linear-gradient(var(--danger), var(--danger)) top left no-repeat,
          linear-gradient(var(--danger), var(--danger)) top right no-repeat,
          linear-gradient(var(--danger), var(--danger)) top right no-repeat,
          linear-gradient(var(--danger), var(--danger)) bottom left no-repeat,
          linear-gradient(var(--danger), var(--danger)) bottom left no-repeat,
          linear-gradient(var(--danger), var(--danger)) bottom right no-repeat,
          linear-gradient(var(--danger), var(--danger)) bottom right no-repeat;
        background-size:
          var(--bracket-len) var(--bracket-thick),
          var(--bracket-thick) var(--bracket-len),
          var(--bracket-len) var(--bracket-thick),
          var(--bracket-thick) var(--bracket-len),
          var(--bracket-len) var(--bracket-thick),
          var(--bracket-thick) var(--bracket-len),
          var(--bracket-len) var(--bracket-thick),
          var(--bracket-thick) var(--bracket-len);
      }
      .hero h2 {
        margin: 0;
        font-size: clamp(1.3rem, 2.4vw, 1.8rem);
        font-weight: 600;
        letter-spacing: -0.035em;
      }
      .hero-anchor {
        font-family: var(--font-mono);
        color: var(--danger);
        overflow-wrap: anywhere;
        font-size: 0.86rem;
        padding: 8px 10px;
        background: var(--danger-soft);
        border-radius: var(--radius-md);
        margin-top: 4px;
      }
      .section-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .subcard {
        border: 1px solid var(--line);
        border-radius: 0;
        background: var(--panel-2);
        padding: 16px;
      }
      .list {
        display: grid;
        gap: 6px;
        margin-top: 10px;
      }
      .item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--item-bg);
        padding: 10px 12px;
      }
      .item-main {
        min-width: 0;
      }
      .item-title {
        overflow-wrap: anywhere;
        font-weight: 500;
        font-size: 0.88rem;
        letter-spacing: -0.01em;
      }
      .item-meta {
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 0.74rem;
        margin-top: 3px;
      }
      .failure-path {
        display: grid;
        gap: 6px;
        margin-top: 10px;
      }
      .failure-step {
        display: grid;
        grid-template-columns: 8px minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--item-bg);
        padding: 10px 12px;
      }
      .failure-step::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ok);
      }
      .failure-step.anchor {
        border-color: var(--danger-soft);
        background: var(--danger-soft);
      }
      .failure-step.anchor::before {
        background: var(--danger);
      }
      .failure-step .item-title {
        font-family: var(--font-mono);
        font-size: 0.82rem;
      }
      .impact {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        margin-top: 14px;
      }
      .impact .subcard {
        min-height: 96px;
      }
      .impact-value {
        margin-top: 8px;
        font: 500 1.6rem/1 var(--font-mono);
        letter-spacing: -0.04em;
        color: var(--text);
      }
      aside .panel {
        position: sticky;
        top: 18px;
        max-height: calc(100vh - 36px);
        display: flex;
        flex-direction: column;
      }
      #recent-list {
        overflow: auto;
        padding-right: 2px;
      }
      .recent-link {
        display: grid;
        gap: 6px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--item-bg);
        padding: 12px;
        margin-bottom: 6px;
        transition:
          border-color 0.15s ease,
          background 0.15s ease;
      }
      .recent-link:hover {
        border-color: var(--line-strong);
        background: var(--row-hover);
      }
      .recent-top {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }
      .empty,
      .error-box,
      .loading {
        border: 1px dashed var(--line-strong);
        border-radius: 0;
        color: var(--muted);
        padding: 28px;
        text-align: center;
        font-size: 0.92rem;
      }
      .empty strong {
        color: var(--text);
        display: block;
        margin-bottom: 6px;
      }
      .error-box {
        color: var(--danger);
        border-color: var(--danger-soft);
        background: var(--danger-soft);
      }
      .empty-state {
        color: var(--muted);
        line-height: 1.5;
        max-width: 56ch;
        margin: 0 auto;
      }
      .empty-state code {
        background: var(--panel-2);
        padding: 1px 6px;
        border-radius: 4px;
        font-family: var(--font-mono);
        font-size: 0.9em;
      }
      .empty-state a {
        color: var(--info);
        text-decoration: underline;
      }
      .error-state {
        padding: 12px;
        border: 1px solid var(--danger-soft);
        border-radius: var(--radius-md);
        background: var(--panel-2);
        color: var(--text);
        text-align: left;
      }
      .error-state code {
        font-family: var(--font-mono);
        color: var(--danger);
        overflow-wrap: anywhere;
      }
      .error-state .muted {

      .incident-strip {

      .cascade-col,

      @media (prefers-reduced-motion: reduce) {

        .skeleton {
          animation: none;
        }

    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div id="live-region" class="sr-only" aria-live="polite"></div>
    <div id="copy-toast" class="copy-toast" role="status" aria-live="polite" hidden></div>
    <div id="app" class="app">
      <div class="loading" aria-busy="true">
        <span class="skeleton skeleton-row long"></span>
        <span class="skeleton skeleton-row long"></span>
        <span class="skeleton skeleton-row short"></span>
      </div>
    </div>

    <script type="module">
      const windows = ["15m", "1h", "6h", "24h"];
      const state = {
        window: localStorage.getItem("waylog-dashboard-window") || "15m",
        capabilities: null,
        errors: null,
        recent: null,
        incidents: null,
        timers: [],
        lastUpdated: null,
      };
      if (!windows.includes(state.window)) state.window = "15m";

      const nf = new Intl.NumberFormat();
      const msf = new Intl.NumberFormat(undefined, {
        maximumFractionDigits: 0,
      });
      const dtf = new Intl.DateTimeFormat(undefined, {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
      });
      const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
      const themeColors = { dark: "#231F1C", light: "#f6f8fb" };
      function isLocalDemo() {
        return ["localhost", "127.0.0.1", "::1"].includes(
          window.location.hostname,
        );
      }
      const IS_LOCAL_DEMO = isLocalDemo();
      const TRIAGE_REPORT_TEMPLATE =
        "/v1/triage/{id}/report?format=markdown&snapshot=true";
      const alertEvidenceExpanded = {};

      class ApiError extends Error {
        constructor(status, code, message, detail) {
          super(message || code || "request failed");
          this.status = status;
          this.code = code || "";
          this.detail = detail || "";
        }
      }

      async function fetchJSON(url) {
        const res = await fetch(url, { credentials: "same-origin" });
        const text = await res.text();
        let body = null;
        if (text) {
          try {
            body = JSON.parse(text);
          } catch (_) {}
        }
        if (!res.ok) {
          const err = body && body.error ? body.error : {};
          throw new ApiError(
            res.status,
            err.code,
            err.message || text || res.statusText,
            err.detail,
          );
        }
        return body || {};
      }
      async function fetchText(url) {
        const res = await fetch(url, { credentials: "same-origin" });
        const text = await res.text();
        if (!res.ok) {
          throw new ApiError(res.status, "", text || res.statusText, "");
        }
        return text;
      }

      function esc(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (ch) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[ch],
        );
      }
      function shortID(id) {
        id = String(id || "");
        return id.length > 14 ? id.slice(0, 12) + "…" : id;
      }
      function ago(ts) {
        const d = Date.now() - new Date(ts).getTime();
        if (!Number.isFinite(d)) return "unknown";
        const sec = Math.round(d / 1000);
        if (sec < 60) return rtf.format(-sec, "second");
        const min = Math.round(sec / 60);
        if (min < 60) return rtf.format(-min, "minute");
        const hr = Math.round(min / 60);
        return rtf.format(-hr, "hour");
      }
      function absoluteTime(ts) {
        const d = new Date(ts);
        return Number.isFinite(d.getTime()) ? d.toLocaleString() : "unknown";
      }
      function statusClass(status) {
        const known = [
            "error",
            "timeout",
            "partial",
            "aborted",
            "suppressed",
          "missing",
          "critical",
          "warning",
          "ok",
        ];
        const s = (status || "").toLowerCase();
        if (known.includes(s)) return s;
        if (
          [
            "crit",
            "page",
            "pager",
            "p0",
            "p1",
            "sev0",
            "sev1",
            "s0",
            "s1",
            "high",
            "alert",
            "fatal",
            "emergency",
          ].includes(s)
        )
          return "critical";
        if (["p2", "sev2", "s2", "medium", "warn"].includes(s)) return "warning";
        if (
          ["p3", "p4", "sev3", "sev4", "s3", "s4", "low", "info", "notice"].includes(s)
        )
          return "warning";
        return "warning";
      }
      const severityRanks = {
        critical: 5,
        crit: 5,
        fatal: 5,
        emergency: 5,
        page: 5,
        pager: 5,
        p0: 5,
        sev0: 5,
        s0: 5,
        p1: 5,
        sev1: 5,
        s1: 5,
        high: 4,
        error: 4,
        alert: 3,
        warn: 2,
        warning: 2,
        p2: 2,
        sev2: 2,
        s2: 2,
        medium: 2,
        info: 1,
        notice: 1,
        low: 1,
        p3: 1,
        p4: 1,
        sev3: 1,
        sev4: 1,
        s3: 1,
        s4: 1,
      };
      function severityRank(severity) {
        const key = String(severity || "alert").toLowerCase();
        return severityRanks[key] ?? 0;
      }
      function sortAlertsBySeverity(alerts) {
        return (alerts || []).slice().sort((a, b) => {
          const rankDiff = severityRank(b?.severity) - severityRank(a?.severity);
          if (rankDiff !== 0) return rankDiff;
          const aT = Date.parse(a?.matched_at || "") || 0;
          const bT = Date.parse(b?.matched_at || "") || 0;
          if (aT !== bT) return bT - aT;
          return String(a?.signal_id || "").localeCompare(String(b?.signal_id || ""));
        });
      }
      function highestSeverity(alerts) {
        let best = "alert";
        let bestRank = -1;
        (alerts || []).forEach((alert) => {
          const severity = String(alert.severity || "alert").toLowerCase();
          const rank = severityRank(severity);
          if (rank > bestRank) {
            best = severity;
            bestRank = rank;
          }
        });
        return best;
      }
      function statusLabel(status) {
        return (
          {
            active: "still open",
            recovering: "recovering",
            resolved: "auto-resolved",
          }[status] ||
          status ||
          "unknown"
        );
      }
      function formatFamily(f) {
        return [f?.service, f?.step, f?.error_code]
          .map((part) => String(part || "").replaceAll(":", "\\:"))
          .join(":");
      }
      function parseHash() {
        const raw = location.hash || "#/errors";
        const parts = raw.slice(2).split("/");
        return {
          screen: parts[0] || "errors",
          id: decodeURIComponent(parts.slice(1).join("/")),
        };
      }
      function params(obj) {
        const q = new URLSearchParams();
        Object.entries(obj).forEach(([k, v]) => {
          if (v !== undefined && v !== null && v !== "") q.set(k, v);
        });
        return q.toString();
      }
      function currentTheme() {
        return document.documentElement.dataset.theme === "light"
          ? "light"
          : "dark";
      }
      function applyTheme(theme) {
        const next = theme === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        document.documentElement.style.colorScheme = next;
        localStorage.setItem("waylog-dashboard-theme", next);
        const meta = document.getElementById("theme-color-meta");
        if (meta) meta.setAttribute("content", themeColors[next]);
      }
      function themeButtonLabel() {
        // Both literals appear in source so static tests (and screen readers)
        // can find "Light theme" / "Dark theme" regardless of current state.
        return currentTheme() === "light"
          ? "Switch to Dark theme"
          : "Switch to Light theme";
      }
      const ICON_SUN = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`;
      const ICON_MOON = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
      const ICON_REFRESH = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>`;
      function themeButtonIcon() {
        return currentTheme() === "light" ? ICON_MOON : ICON_SUN;
      }
      function emptyStateCopy(kind) {
        const noun = esc(kind || "data");
        if (IS_LOCAL_DEMO) {
          return `No ${noun} yet — the auto-fire loop produces one every ~60 seconds. Or run <code>./scripts/demo-fire-burst.sh</code> for an immediate burst.`;
        }
        return `No ${noun} yet. Install the TypeScript SDK from source and send a wide event from your app to begin.`;
      }
      function apiErrorMessage(err, fallback) {
        return (
          (err && (err.detail || err.message)) || fallback || "Request failed."
        );
      }
      function renderApiError(err, hint) {
        return `<div class="error-state" role="alert">
          <p><strong>Error:</strong> <code>${esc(apiErrorMessage(err))}</code></p>
          <p class="muted">${esc(hint || "Check the ingest server is running, then retry.")}</p>
          <p><button type="button" data-retry-fetch>Retry</button></p>
        </div>`;
      }
      async function loadCapabilities() {
        state.capabilities = await fetchJSON("/v1/capabilities");
      }
      async function loadIncidents() {
        try {
          return await fetchJSON("/v1/incidents/active");
        } catch (err) {
          if (err.status === 404 || err.status === 503)
            return { incidents: [] };
          throw err;
        }
      }
      async function loadDashboardData() {
        const [errors, recent, incidents] = await Promise.all([
          fetchJSON(
            "/v1/errors?" + params({ window: state.window, limit: 50 }),
          ),
          fetchJSON(
            "/v1/traces/recent?" +
              params({
                window: state.window,
                limit: 50,
                include_suppressed: true,
              }),
          ),
          loadIncidents(),
        ]);
        state.errors = errors;
        state.recent = recent;
        state.incidents = incidents;
        state.lastUpdated = new Date();
      }

      function shell(content) {
        const route = parseHash();
        return `
          <header class="topbar">
            <div class="brand">
              <span class="name">Crux</span>
              <span class="div">/</span>
              <span class="ctx">Triage</span>
            </div>
            <div class="top-actions">
              <a class="topbar-link" href="http://localhost:9081/demo" target="_blank" rel="noopener">Demo controls</a>
              <span class="last-updated" id="last-updated">${state.lastUpdated ? "Updated " + dtf.format(state.lastUpdated) : "Not updated"}</span>
              <label>
                <span class="sr-only">Window</span>
                <select id="window-select" aria-label="Select time window">
                  ${windows.map((w) => `<option value="${w}" ${w === state.window ? "selected" : ""}>${w}</option>`).join("")}
                </select>
              </label>
              <button id="refresh-btn" class="icon-btn" type="button" aria-label="Refresh">${ICON_REFRESH}</button>
              <button id="theme-toggle" class="icon-btn" type="button" aria-label="${themeButtonLabel()}">${themeButtonIcon()}</button>
            </div>
          </header>
          <p class="page-intro">Find the failure that started the cascade.</p>
          ${renderTriageKpis()}
          <nav class="route-tabs" aria-label="Dashboard screens">
            ${tab("#/errors", "Errors", route.screen === "errors")}
            ${tab("#/explain/" + encodeURIComponent(firstTraceID()), "Explain", route.screen === "explain", !firstTraceID())}
            ${tab("#/blast/" + encodeURIComponent(firstFamily()), "Blast", route.screen === "blast", !firstFamily())}
          </nav>
          <main id="main" class="shell">
            <section>
              ${renderIncidentStrip()}
              <div class="card panel" aria-live="polite">${content}</div>
            </section>
            <aside>${renderRecent()}</aside>
          </main>
        `;
      }
      function kpi(label, value, sub) {
        return `<article class="card kpi"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="sub">${esc(sub)}</div></article>`;
      }
      function triageMetrics() {
        const incidents = state.incidents?.incidents || [];
        let topCause = "";
        let topSeverity = -1;
        let lastAt = null;
        let totalRequests = 0;
        incidents.forEach((inc) => {
          totalRequests += Number(inc.affected_requests || 0);
          const sev = Number(inc.severity || 0);
          if (sev > topSeverity) {
            topSeverity = sev;
            topCause = inc.cause || "unknown";
          }
          const t = inc.last_seen_at || inc.started_at;
          if (t) {
            const ts = new Date(t).getTime();
            if (Number.isFinite(ts) && (lastAt === null || ts > lastAt)) {
              lastAt = ts;
            }
          }
        });
        return {
          count: incidents.length,
          topCause,
          topSeverity,
          lastAt,
          totalRequests,
        };
      }
      function renderTriageKpis() {

            ${kpi("Since last incident", "—", "No incidents observed yet.")}
            ${kpi("Affected requests", zero, "Across active incidents.")}
          </section>`;
        }
        const causeSub =
          m.topSeverity >= 0
            ? `severity ${nf.format(m.topSeverity)} · driver of the active incidents`
            : "driver of the active incidents";
        return `<section class="kpis" aria-label="Triage metrics">
          ${kpi("Active incidents", nf.format(m.count), "currently open and unresolved")}
          ${kpi("Highest cause", m.topCause || "unknown", causeSub)}
          ${kpi("Since last incident", m.lastAt ? ago(new Date(m.lastAt).toISOString()) : "—", "most recent activity across incidents")}
          ${kpi("Affected requests", nf.format(m.totalRequests), "summed across active incidents")}

      }

            ${storyCard("Sample traces", `<div class="list">${(blast.sample_traces || []).map((id) => `<a class="item" href="#/explain/${encodeURIComponent(id)}"><span class="item-title mono">${esc(shortID(id))}</span></a>`).join("") || "<div class='empty'>No sample traces.</div>"}</div>`)}

      let lastIncidentRender = { id: null, json: "" };

      function capturedFooter(l, source, tag = "div", verb = "captured") {

      function snapshotValue(snapshot) {
        if (!snapshot) return { evidence: null, source: "" };
        if (snapshot.latest)

          return { evidence: snapshot.opening, source: "opening fallback" };

      function renderPropagationBlock(p) {
        const { evidence: l, source } = snapshotValue(p);
        if (!l) {
          return `<section class="card panel bracketed cascade-card">
            <div class="panel-head"><div><h2 class="panel-title">Failure cascade from sampled trace</h2><div class="cascade-caption">A trace-backed cascade from the first observed failure through the sampled request path.</div></div><span class="status missing">missing</span></div>

        const rows = (l.path || [])

            return `<div class="failure-step cascade-step ${cls}">

        const sampleLink = l.sample_trace_id

        const unavailable =
          l.capture_status !== "ok"
            ? `<div class="empty"><p class="empty-state">Propagation evidence unavailable (${esc(l.capture_status)}) — retrying.</p></div>`
            : "";
        return `<section class="card panel bracketed cascade-card">
          <div class="panel-head"><div><h2 class="panel-title">Failure cascade from sampled trace</h2><div class="cascade-caption">A trace-backed cascade from the first observed failure through the sampled request path.</div></div><span class="status ${statusClass(l.capture_status)}">${esc(l.capture_status || "unknown")}</span></div>
          <div class="cascade-origin">

          </div>

          <div class="cascade-footer">

      function blastImpactDiffers(o, l) {
        if (!o || !l) return false;
        if (o.affected_requests !== l.affected_requests) return true;
        if (o.affected_services !== l.affected_services) return true;
        if ((o.affected_users || 0) !== (l.affected_users || 0)) return true;
        const a = o.top_services || [],
          b = l.top_services || [];
        if (a.length !== b.length) return true;
        for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return true;
        if ((o.sampled_traces || []).length !== (l.sampled_traces || []).length)
          return true;
        return false;
      }
      function renderBlastBlock(b) {
        const { evidence: l, source } = snapshotValue(b);
        if (!l) {
          return `<section class="card panel">
            <div class="panel-head"><div><h2 class="panel-title">Blast radius</h2></div><span class="status missing">missing</span></div>
            <div class="empty"><p class="empty-state">Blast evidence unavailable for this incident yet.</p></div>
          </section>`;
        }
        const o = b.opening;
        const showDelta = o && blastImpactDiffers(o, l);
        const usersFmt = (u) =>
          u === null || u === undefined
            ? "users unknown"
            : `${nf.format(u)} users`;
        const row = (e, label) =>
          `<div class="impact-row"><strong>${esc(label)}</strong><span>${nf.format(e.affected_requests || 0)} requests · ${nf.format(e.affected_services || 0)} services · ${esc(usersFmt(e.affected_users))}</span></div>`;

        const traces =
          (l.sampled_traces || [])
            .map(
              (id) =>
                `<a class="sample-link" href="#/explain/${encodeURIComponent(id)}">${esc(shortID(id))}</a>`,
            )
            .join("") || `<span class="faint">none</span>`;
        return `<section class="card panel">
          <div class="panel-head"><div><h2 class="panel-title">Blast radius</h2><div class="panel-sub">How bad is it?</div></div><span class="status ${statusClass(l.capture_status)}">${esc(l.capture_status || "unknown")}</span></div>
          ${showDelta ? row(o, "At open") + row(l, "Now") : row(l, "Now")}
          ${top}
          <div class="samples">${traces}</div>
          ${capturedFooter(l, source)}

      }
      function renderAlertEvidenceBlock(alerts, incidentID) {
        const { evidence: l, source } = snapshotValue(alerts);

          const status = l?.capture_status || "missing";
          return `<section class="card panel" data-alert-evidence data-expanded="false" data-incident-id="${esc(incidentID || "")}">
            <div class="panel-head"><div><h2 class="panel-title">Alert evidence</h2><div class="panel-sub">Alertmanager matches</div></div><span class="status ${statusClass(status)}">${esc(status)}</span></div>
            <div class="empty"><p class="empty-state">No matched Alertmanager evidence for this incident yet.</p></div>
          </section>`;
        }
        const all = sortAlertsBySeverity(l.matches || []);
        const count = all.length;
        const topSev = highestSeverity(all);
        const sources = Array.from(new Set(all.map((a) => a.source || "unknown")));
        const strategies = Array.from(new Set(all.map((a) => a.strategy || "unknown")));
        const sourceLabel = sources.length === 1 ? sources[0] : `${sources.length} sources`;
        const strategyLabel = strategies.length === 1 ? strategies[0] : `${strategies.length} strategies`;
        const summary = `<div class="item-meta">${nf.format(count)} matched · highest severity <strong>${esc(topSev)}</strong> · ${esc(sourceLabel)} · ${esc(strategyLabel)}</div>`;
        const localhost = IS_LOCAL_DEMO;
        const expanded = !!alertEvidenceExpanded[incidentID || ""];
        const renderRow = (alert, idx) => {
          const provider = safeHTTPURL(alert.provider_url);
          const hidden = idx >= 3 && !expanded ? " hidden" : "";
          const shortSignal = shortID(alert.signal_id || "");
          const shortAlert = alert.alert_id ? shortID(alert.alert_id) : "";
          return `<article class="alert-item" data-alert-row${hidden}>
            <div class="alert-title">
              <strong>${esc(alert.reason || alert.alert_id || alert.signal_id || "matched alert")}</strong>
              <span class="status ${statusClass(alert.severity)}">${esc(alert.severity || "alert")}</span>
            </div>
            <div class="item-meta">signal_id <span title="${esc(alert.signal_id || "unknown")}">${esc(shortSignal || "unknown")}</span>${shortAlert ? ` · alert_id <span title="${esc(alert.alert_id)}">${esc(shortAlert)}</span>` : ""}</div>
            <div class="item-meta">source ${esc(alert.source || "unknown")} · strategy ${esc(alert.strategy || "unknown")} · matched <span title="${esc(absoluteTime(alert.matched_at))}">${esc(ago(alert.matched_at))}</span></div>
            ${provider ? `<a class="sample-link" href="${esc(provider)}" target="_blank" rel="noopener">Open provider URL →</a>` : ""}
          </article>`;
        };
        const rows = all.map(renderRow).join("");
        const toggleLabel = expanded
          ? "Show fewer alerts"
          : `Show all ${nf.format(count)} alerts`;
        const toggle = count > 3
          ? `<button type="button" class="alert-expand" data-alert-expand>${esc(toggleLabel)}</button>`
          : "";
        const hasProvider = all.some((a) => safeHTTPURL(a.provider_url));
        const note = hasProvider
          ? localhost
            ? `<p class="provider-note">Demo provider links may point back to demo controls. In production, this opens Alertmanager, Grafana, or PagerDuty.</p>`
            : `<p class="provider-note">Provider links open the alert source configured for this incident.</p>`
          : "";
        return `<section class="card panel" data-alert-evidence data-expanded="${expanded ? "true" : "false"}" data-incident-id="${esc(incidentID || "")}">
          <div class="panel-head"><div><h2 class="panel-title">Alert evidence</h2><div class="panel-sub">Alertmanager matches</div></div><span class="status ${statusClass(l.capture_status)}">${esc(l.capture_status || "unknown")}</span></div>
          ${summary}
          <div class="alert-list">${rows}</div>
          ${toggle}
          ${note}
          ${capturedFooter(l, source)}
        </section>`;
      }
      function runtimeSubtypeLabel(s) {
        const map = {
          oom_killed: "OOMKilled",
          crashloop: "CrashLoopBackOff",
          readiness_fail: "Readiness fail",
          liveness_fail: "Liveness fail",
          panic: "Panic",
          unhandled_rejection: "Unhandled rejection",
          uncaught_exception: "Uncaught exception",
        };
        return map[s] || (s || "runtime event");
      }
      function runtimeSourceKind(src) {
        return src === "go-sdk" || src === "ts-sdk"
          ? "Application"
          : "Infrastructure";
      }
      function renderRuntimeBlock(runtime) {
        const matches = (runtime && runtime.matches) || [];
        if (!matches.length) {
          const status =
            (runtime && runtime.latest && runtime.latest.capture_status) ||
            "missing";
          return `<section class="card panel" data-runtime-evidence>
            <div class="panel-head"><div><h2 class="panel-title">Runtime evidence</h2><div class="panel-sub">Infrastructure &amp; application failures</div></div><span class="status ${statusClass(status)}">${esc(status)}</span></div>
            <div class="empty"><p class="empty-state">No correlated runtime events (pod restarts, OOMKills, panics) for this incident yet.</p></div>
          </section>`;
        }
        const infra = matches.filter(
          (m) => runtimeSourceKind(m.source) === "Infrastructure",
        );
        const app = matches.filter(
          (m) => runtimeSourceKind(m.source) === "Application",
        );
        const summary = `<div class="item-meta">${nf.format(matches.length)} runtime event${matches.length === 1 ? "" : "s"} · ${nf.format(infra.length)} infrastructure · ${nf.format(app.length)} application</div>`;
        const renderRow = (m) =>
          `<article class="runtime-item" data-runtime-row data-subtype="${esc(m.subtype || "")}" data-source="${esc(m.source || "")}">
            <div class="runtime-title">
              <span class="status ${statusClass(m.severity)}">${esc(runtimeSubtypeLabel(m.subtype))}</span>
              <strong>${esc(m.service || "service")}</strong>
              <span class="faint">${esc(runtimeSourceKind(m.source))}</span>
            </div>
            <div class="item-meta">${esc(m.reason || "runtime event")}</div>
            <div class="item-meta">source ${esc(m.source || "unknown")} · signal_id <span title="${esc(m.signal_id || "unknown")}">${esc(shortID(m.signal_id || "") || "unknown")}</span> · occurred <span title="${esc(absoluteTime(m.occurred_at))}">${esc(ago(m.occurred_at))}</span></div>
          </article>`;
        const status =
          (runtime.latest && runtime.latest.capture_status) || "ok";
        return `<section class="card panel" data-runtime-evidence>
          <div class="panel-head"><div><h2 class="panel-title">Runtime evidence</h2><div class="panel-sub">Infrastructure &amp; application failures</div></div><span class="status ${statusClass(status)}">${esc(status)}</span></div>
          ${summary}
          <div class="runtime-list">${matches.map(renderRow).join("")}</div>
          ${runtime.latest ? capturedFooter(runtime.latest, "latest") : ""}
        </section>`;
      }
      function safeHTTPURL(raw) {
        if (!raw) return "";
        try {
          const u = new URL(raw);
          return u.protocol === "http:" || u.protocol === "https:"
            ? u.href
            : "";
        } catch (_) {
          return "";
        }
      }
      function renderTriageReportDrawer(incidentID) {
        return `<div id="report-drawer" class="report-drawer" hidden>
          <div class="report-drawer-backdrop" data-report-close></div>
          <section class="report-panel" role="dialog" aria-modal="true" aria-labelledby="report-drawer-title">
            <div class="panel-head">
              <div><h2 id="report-drawer-title" class="panel-title">Triage report</h2><div class="panel-sub">Report preview</div></div>
              <div class="report-actions">
                <button id="copy-report" type="button" disabled>Copy markdown</button>
                <button type="button" data-report-close>Close</button>
              </div>
            </div>
            <pre id="report-body" class="report-body" data-incident-id="${esc(incidentID)}">${esc("Loading…")}</pre>
          </section>
        </div>`;
      }
      function renderEvidence(items) {
        if (!items.length)
          return `<div class="empty">No incident evidence attached.</div>`;
        return `<ul class="evidence-list">${items
          .map(
            (item) => `<li>
          <div class="item-title">${esc(item.title || item.kind || "evidence")}</div>
          <div class="item-meta">${esc(item.kind || "unknown")}${item.detail ? " · " + esc(item.detail) : ""}${item.service ? " · " + esc(item.service) : ""}</div>
        </li>`,
          )
          .join("")}</ul>`;
      }
      function renderChecks(items) {
        if (!items.length)
          return `<div class="empty">No next checks generated.</div>`;
        return `<ul class="check-list">${items.map((check) => `<li>${esc(check)}</li>`).join("")}</ul>`;
      }
      function renderIncidentSamples(ids) {
        if (!ids.length)
          return `<div class="empty">No sample traces attached.</div>`;
        return `<div class="list">${ids.map((id) => `<a class="item" href="#/explain/${encodeURIComponent(id)}"><span class="item-title mono">${esc(shortID(id))}</span><span class="item-meta">open explain</span></a>`).join("")}</div>`;
      }
      function renderWarnings(items) {
        if (!items.length)
          return `<div class="empty">No instrumentation warnings.</div>`;
        return `<ul class="check-list">${items.map((warning) => `<li>${esc(warning)}</li>`).join("")}</ul>`;
      }
      function impact(label, value) {
        return `<article class="subcard"><div class="panel-sub">${esc(label)}</div><div class="impact-value">${esc(typeof value === "number" ? nf.format(value) : value)}</div></article>`;
      }
      function displayBlastKey(key) {
        if (!key) return "";
        return key.service && key.step
          ? formatFamily({
              service: key.service,
              step: key.step,
              error_code: key.error_code,
            })
          : key.error_code;
      }
      let reportReturnFocus = null;
      let reportRequestSeq = 0;
      async function openReportDrawer(incidentID, trigger) {
        const drawer = document.getElementById("report-drawer");
        const body = document.getElementById("report-body");
        const copy = document.getElementById("copy-report");
        if (!drawer || !body || !incidentID) return;
        reportReturnFocus = trigger || document.activeElement;
        drawer.hidden = false;
        body.textContent = "Loading…";
        body.dataset.incidentId = incidentID;
        if (copy) copy.disabled = true;
        const close = drawer.querySelector("[data-report-close]");
        if (close) close.focus();
        const requestSeq = ++reportRequestSeq;
        try {
          const url = TRIAGE_REPORT_TEMPLATE.replace(
            "{id}",
            encodeURIComponent(incidentID),
          );
          const report = await fetchText(url);
          if (
            requestSeq !== reportRequestSeq ||
            drawer.hidden ||
            body.dataset.incidentId !== incidentID
          )
            return;
          body.textContent = report;
          if (copy) copy.disabled = false;
        } catch (err) {
          if (
            requestSeq !== reportRequestSeq ||
            drawer.hidden ||
            body.dataset.incidentId !== incidentID
          )
            return;
          body.textContent = `Error: ${apiErrorMessage(err, "report request failed")}`;
        }
      }
      function closeReportDrawer() {
        const drawer = document.getElementById("report-drawer");
        if (!drawer) return;
        reportRequestSeq++;
        drawer.hidden = true;
        if (reportReturnFocus && typeof reportReturnFocus.focus === "function")
          reportReturnFocus.focus();
        reportReturnFocus = null;
      }
      let copyToastTimer = null;
      function showToast(message, kind) {
        const toast = document.getElementById("copy-toast");
        if (!toast) return;
        toast.textContent = message;
        toast.classList.toggle("error", kind === "error");
        toast.hidden = false;
        if (copyToastTimer) clearTimeout(copyToastTimer);
        copyToastTimer = setTimeout(() => {
          toast.hidden = true;
        }, 3500);
      }
      async function copyReportMarkdown() {
        const body = document.getElementById("report-body");
        const live = document.getElementById("live-region");
        if (!body) return;
        try {
          await navigator.clipboard.writeText(body.textContent || "");
          if (live) live.textContent = "Triage report markdown copied.";
          showToast("Markdown copied", "success");
        } catch (_) {
          if (live) live.textContent = "Could not copy report markdown.";
          showToast("Could not copy markdown", "error");
        }
      }
      function reportDrawerOpen() {
        const drawer = document.getElementById("report-drawer");
        return !!drawer && !drawer.hidden;
      }

      async function renderCurrentScreen() {
        const route = parseHash();
        if (route.screen !== "incident")
          lastIncidentRender = { id: null, json: "" };
        try {
          if (!state.errors || !state.recent) await loadDashboardData();
          if (route.screen === "explain") {
            document.getElementById("app").innerHTML = await renderExplain(
              route.id,
            );
          } else if (route.screen === "blast") {
            document.getElementById("app").innerHTML = await renderBlast(
              route.id,
            );
          } else if (route.screen === "incident") {
            const html = await renderIncident(route.id);
            if (html === null) return;
            document.getElementById("app").innerHTML = html;
          } else {
            document.getElementById("app").innerHTML = shell(renderErrors());
          }
          bindShell();
        } catch (err) {
          renderError(err);
        }
      }
      function renderError(err) {
        const message =
          err.status === 401
            ? "Session expired. Sign in again to continue."
            : err.detail || err.message || "Dashboard request failed.";
        document.getElementById("app").innerHTML = shell(
          renderApiError(
            { message },
            "Retry below. If the error persists, check that the ingest server is running.",
          ),
        );
        bindShell();
      }
      function bindShell() {
        const select = document.getElementById("window-select");
        if (select)
          select.addEventListener("change", async (event) => {
            state.window = event.target.value;
            localStorage.setItem("waylog-dashboard-window", state.window);
            await refreshAll();
          });
        const refresh = document.getElementById("refresh-btn");
        if (refresh) refresh.addEventListener("click", refreshAll);
        const themeToggle = document.getElementById("theme-toggle");
        if (themeToggle)
          themeToggle.addEventListener("click", () => {
            applyTheme(currentTheme() === "light" ? "dark" : "light");
            themeToggle.innerHTML = themeButtonIcon();
            themeToggle.setAttribute("aria-label", themeButtonLabel());
          });
        const reportButton = document.getElementById("view-triage-report");
        if (reportButton)
          reportButton.addEventListener("click", () =>
            openReportDrawer(reportButton.dataset.incidentId, reportButton),
          );
        document
          .querySelectorAll("[data-report-close]")
          .forEach((button) =>
            button.addEventListener("click", closeReportDrawer),
          );
        const copyReport = document.getElementById("copy-report");
        if (copyReport)
          copyReport.addEventListener("click", copyReportMarkdown);
        document
          .querySelectorAll("[data-retry-fetch]")
          .forEach((button) =>
            button.addEventListener("click", () => {
              refreshAll().catch(reportPollError);
            }),
          );
      }
      async function refreshAll() {
        if (reportDrawerOpen()) return;
        const recent = document.getElementById("recent-list");
        const scrollTop = recent ? recent.scrollTop : 0;
        await loadDashboardData();
        await renderCurrentScreen();
        const nextRecent = document.getElementById("recent-list");
        if (nextRecent) nextRecent.scrollTop = scrollTop;
      }
      function reportPollError(err) {
        const live = document.getElementById("live-region");
        if (live)
          live.textContent =
            "Dashboard refresh failed: " +
            (err.detail || err.message || "request failed");
      }
      function startPolling() {
        state.timers.forEach(clearInterval);
        state.timers = [
          setInterval(() => refreshAll().catch(reportPollError), 5000),
        ];
      }

      window.addEventListener("hashchange", renderCurrentScreen);
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeReportDrawer();
      });
      document.addEventListener("click", (event) => {
        const btn = event.target.closest("[data-alert-expand]");
        if (!btn) return;
        const section = btn.closest("[data-alert-evidence]");
        if (!section) return;
        const expanded = section.dataset.expanded === "true";
        section.dataset.expanded = expanded ? "false" : "true";
        const rows = section.querySelectorAll("[data-alert-row]");
        rows.forEach((row, idx) => {
          if (idx < 3) return;
          row.hidden = expanded;
        });
        btn.textContent = expanded
          ? `Show all ${nf.format(rows.length)} alerts`
          : "Show fewer alerts";
        if (section.dataset.incidentId)
          alertEvidenceExpanded[section.dataset.incidentId] =
            section.dataset.expanded === "true";
      });
      try {
        await loadCapabilities();
        await loadDashboardData();
        if (!location.hash) location.hash = "#/errors";
        await renderCurrentScreen();
        startPolling();
      } catch (err) {
        document.getElementById("app").innerHTML =
          `<div class="error-box" role="alert">
            <p><strong>Unable to load the dashboard.</strong></p>
            <p class="muted">${esc(err.message || "The ingest server may not be running.")}</p>
            <p><button type="button" onclick="window.location.reload()">Retry</button></p>
          </div>`;
      }
    </script>
  </body>
</html>
