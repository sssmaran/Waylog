<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0f17" id="theme-color-meta" />
    <title>Waylog v2 Triage</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("waylog-dashboard-theme");
          var theme = saved === "light" || saved === "dark"
            ? saved
            : window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var meta = document.getElementById("theme-color-meta");
          if (meta) meta.setAttribute("content", theme === "light" ? "#f6f8fb" : "#0b0f17");
        } catch (_) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #050505;
        --bg-2: #080808;
        --panel: #0c0c0c;
        --panel-2: #121212;
        --line: #1c1c1c;
        --line-strong: #2a2a2a;
        --text: #f5f0e6;
        --muted: #9a958a;
        --faint: #5d5851;
        --danger: #f87171;
        --danger-soft: rgba(248, 113, 113, 0.18);
        --warn: #fbbf24;
        --warn-soft: rgba(251, 191, 36, 0.18);
        --ok: #5eff8b;
        --ok-soft: rgba(94, 255, 139, 0.18);
        --info: #60a5fa;
        --info-soft: rgba(96, 165, 250, 0.18);
        --accent: #5eff8b;
        --accent-bright: #5eff8b;
        --accent-soft: rgba(94, 255, 139, 0.18);
        --control-bg: transparent;
        --control-hover: #141414;
        --row-bg: #0c0c0c;
        --row-hover: #141414;
        --item-bg: #0c0c0c;
        --active-text: #050505;
        --active-bg: var(--accent-bright);
        --link-hover: var(--text);
        --shadow: none;
        --radius-xl: 10px;
        --radius-lg: 8px;
        --radius-md: 6px;
        --bracket-len: 14px;
        --bracket-thick: 1.5px;
        --font-sans: "Geist", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-mono: "Geist Mono", "SF Mono", Consolas, monospace;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #ece7da;
        --bg-2: #e3ddcc;
        --panel: #f4efe1;
        --panel-2: #ede7d6;
        --line: #cdc6b4;
        --line-strong: #a8a18d;
        --text: #0a0a0a;
        --muted: #585448;
        --faint: #8a8473;
        --danger: #b42318;
        --danger-soft: rgba(180, 35, 24, 0.14);
        --warn: #b45309;
        --warn-soft: rgba(180, 83, 9, 0.16);
        --ok: #15803d;
        --ok-soft: rgba(34, 197, 94, 0.18);
        --info: #1d4ed8;
        --info-soft: rgba(29, 78, 216, 0.12);
        --accent: #15803d;
        --accent-bright: #22c55e;
        --accent-soft: rgba(34, 197, 94, 0.18);
        --control-bg: transparent;
        --control-hover: #ede7d6;
        --row-bg: #f4efe1;
        --row-hover: #ede7d6;
        --item-bg: #f4efe1;
        --active-text: #052e15;
        --active-bg: var(--accent-bright);
        --link-hover: var(--text);
        --shadow: none;
      }

      * { box-sizing: border-box; }
      html {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        min-height: 100vh;
        margin: 0;
        padding: max(28px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(64px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      }
      a { color: inherit; text-decoration: none; transition: color 0.15s ease; }
      a:hover { color: var(--link-hover); }
      button, select {
        height: 36px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--control-bg);
        color: var(--text);
        font: 500 0.82rem/1 var(--font-sans);
        letter-spacing: -0.005em;
        transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
      }
      button { cursor: pointer; touch-action: manipulation; }
      select { padding: 0 32px 0 12px; }
      button:hover, select:hover { border-color: var(--text); background: var(--control-hover); }
      a:focus-visible, button:focus-visible, select:focus-visible {
        outline: 2px solid var(--accent-bright);
        outline-offset: 2px;
      }
      .skip {
        position: absolute;
        left: 18px;
        top: 12px;
        z-index: 10;
        transform: translateY(-180%);
        border-radius: var(--radius-md);
        background: var(--text);
        color: var(--bg);
        padding: 8px 12px;
        font-size: 0.82rem;
        font-weight: 500;
      }
      .skip:focus-visible { transform: translateY(0); }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }
      .app { width: min(1180px, 100%); margin: 0 auto; }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 8px 0 22px;
        border-bottom: 1px dashed var(--line);
      }
      .brand {
        display: inline-flex;
        align-items: baseline;
        gap: 8px;
        font-family: var(--font-mono);
        font-size: 0.82rem;
      }
      .brand .name {
        color: var(--text);
        font-weight: 600;
        font-family: var(--font-sans);
        font-size: 0.98rem;
        letter-spacing: -0.02em;
      }
      .brand .div { color: var(--faint); }
      .brand .ctx { color: var(--muted); }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .eyebrow .num { color: var(--text); }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent-bright);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .page-intro {
        margin: 26px 0 28px;
        color: var(--muted);
        font-size: 1rem;
        max-width: 60ch;
        line-height: 1.55;
      }
      h1 {
        margin: 14px 0 0;
        font-size: clamp(1.7rem, 3.4vw, 2.4rem);
        line-height: 1.05;
        font-weight: 600;
        letter-spacing: -0.045em;
        text-wrap: balance;
        max-width: 22ch;
      }
      .tagline {
        margin-top: 14px;
        color: var(--muted);
        font-size: 0.98rem;
        max-width: 56ch;
        line-height: 1.55;
      }
      .top-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
      .last-updated {
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 0.74rem;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        margin-right: 4px;
      }
      .topbar-link {
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 0.74rem;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        text-decoration: none;
        margin-right: 4px;
      }
      .topbar-link:hover { color: var(--text); text-decoration: underline; }
      .icon-btn {
        width: 36px;
        height: 36px;
        padding: 0;
        display: inline-grid;
        place-items: center;
        color: var(--muted);
      }
      .icon-btn:hover { color: var(--text); }
      .icon-btn svg { display: block; }
      .kpis {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 28px;
      }
      .card {
        position: relative;
        border: 1px solid var(--line);
        border-radius: 0;
        background: var(--panel);
        box-shadow: var(--shadow);
      }
      /* tensorlake-style L-shaped corner brackets — opt in with `.bracketed` */
      .bracketed { position: relative; }
      .bracketed::before {
        content: "";
        position: absolute;
        inset: -1px;
        pointer-events: none;
        background:
          linear-gradient(var(--accent-bright), var(--accent-bright)) top    left  no-repeat,
          linear-gradient(var(--accent-bright), var(--accent-bright)) top    left  no-repeat,
          linear-gradient(var(--accent-bright), var(--accent-bright)) top    right no-repeat,
          linear-gradient(var(--accent-bright), var(--accent-bright)) top    right no-repeat,
          linear-gradient(var(--accent-bright), var(--accent-bright)) bottom left  no-repeat,
          linear-gradient(var(--accent-bright), var(--accent-bright)) bottom left  no-repeat,
          linear-gradient(var(--accent-bright), var(--accent-bright)) bottom right no-repeat,
          linear-gradient(var(--accent-bright), var(--accent-bright)) bottom right no-repeat;
        background-size:
          var(--bracket-len) var(--bracket-thick),
          var(--bracket-thick) var(--bracket-len),
          var(--bracket-len) var(--bracket-thick),
          var(--bracket-thick) var(--bracket-len),
          var(--bracket-len) var(--bracket-thick),
          var(--bracket-thick) var(--bracket-len),
          var(--bracket-len) var(--bracket-thick),
          var(--bracket-thick) var(--bracket-len);
      }
      .kpi {
        position: relative;
        min-height: 84px;
        overflow: hidden;
        padding: 14px 16px 12px;
      }
      .kpi .label {
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 0.66rem;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .kpi .value {
        margin-top: 8px;
        font-family: var(--font-mono);
        font-size: 1.4rem;
        font-weight: 500;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }
      .kpi .sub {
        margin-top: 4px;
        color: var(--faint);
        font-size: 0.72rem;
      }
      .spark {
        position: absolute;
        right: 12px;
        top: 12px;
        width: 38%;
        max-width: 80px;
        height: 28px;
        opacity: 0.85;
      }
      .spark path.area { fill: var(--accent-soft); }
      .spark path.line { fill: none; stroke: var(--accent-bright); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
      .spark.latency path.area { fill: var(--info-soft); }
      .spark.latency path.line { stroke: var(--info); }
      .shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 10px;
        align-items: start;
      }
      .panel { padding: 20px; }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 16px;
      }
      .panel-title {
        margin: 0;
        font-size: 0.98rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .panel-sub {
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .route-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 18px; }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        padding: 0 11px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.01em;
        transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
      }
      .pill:hover { color: var(--text); border-color: var(--line-strong); }
      .pill.active {
        color: var(--active-text);
        border-color: var(--active-bg);
        background: var(--active-bg);
      }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
      th {
        color: var(--faint);
        font-family: var(--font-mono);
        font-size: 0.68rem;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-align: left;
        text-transform: uppercase;
        padding: 0 12px 6px;
      }
      td {
        background: var(--row-bg);
        border-bottom: 1px solid var(--line);
        border-top: 1px solid var(--line);
        padding: 13px 12px;
        vertical-align: middle;
        transition: background 0.15s ease;
      }
      td:first-child { border-left: 1px solid var(--line); border-radius: var(--radius-md) 0 0 var(--radius-md); }
      td:last-child { border-right: 1px solid var(--line); border-radius: 0 var(--radius-md) var(--radius-md) 0; }
      tr:hover td { background: var(--row-hover); }
      .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
      .muted { color: var(--muted); }
      .faint { color: var(--faint); }
      .status {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 22px;
        padding: 0 7px;
        border-radius: 3px;
        font-family: var(--font-mono);
        font-size: 0.7rem;
        font-weight: 500;
        letter-spacing: 0.03em;
        text-transform: lowercase;
      }
      .status.ok { color: var(--ok); background: var(--ok-soft); }
      .status.error, .status.timeout, .status.partial, .status.aborted { color: var(--danger); background: var(--danger-soft); }
      .status.suppressed { color: var(--warn); background: var(--warn-soft); }
      .family { display: grid; gap: 4px; }
      .family strong { font-family: var(--font-mono); font-size: 0.88rem; font-weight: 500; word-break: break-word; }
      .family .muted { font-size: 0.78rem; }
      .samples { display: flex; gap: 6px; flex-wrap: wrap; }
      .sample-link {
        color: var(--text);
        font-family: var(--font-mono);
        font-size: 0.74rem;
        border-bottom: 1px dashed var(--line-strong);
        padding-bottom: 1px;
      }
      .sample-link:hover { color: var(--accent-bright); border-bottom-color: var(--accent-bright); }
      .story-grid { display: grid; gap: 12px; }
      .hero {
        position: relative;
        display: grid;
        gap: 8px;
        padding: 22px;
        border: 1px solid var(--danger-soft);
        border-radius: 0;
        background: var(--panel-2);
      }
      .hero::before {
        content: "";
        position: absolute;
        inset: -1px;
        pointer-events: none;
        background:
          linear-gradient(var(--danger), var(--danger)) top    left  no-repeat,
          linear-gradient(var(--danger), var(--danger)) top    left  no-repeat,
          linear-gradient(var(--danger), var(--danger)) top    right no-repeat,
          linear-gradient(var(--danger), var(--danger)) top    right no-repeat,
          linear-gradient(var(--danger), var(--danger)) bottom left  no-repeat,
          linear-gradient(var(--danger), var(--danger)) bottom left  no-repeat,
          linear-gradient(var(--danger), var(--danger)) bottom right no-repeat,
          linear-gradient(var(--danger), var(--danger)) bottom right no-repeat;
        background-size:
          var(--bracket-len) var(--bracket-thick),
          var(--bracket-thick) var(--bracket-len),
          var(--bracket-len) var(--bracket-thick),
          var(--bracket-thick) var(--bracket-len),
          var(--bracket-len) var(--bracket-thick),
          var(--bracket-thick) var(--bracket-len),
          var(--bracket-len) var(--bracket-thick),
          var(--bracket-thick) var(--bracket-len);
      }
      .hero h2 {
        margin: 0;
        font-size: clamp(1.3rem, 2.4vw, 1.8rem);
        font-weight: 600;
        letter-spacing: -0.035em;
      }
      .hero-anchor {
        font-family: var(--font-mono);
        color: var(--danger);
        overflow-wrap: anywhere;
        font-size: 0.86rem;
        padding: 8px 10px;
        background: var(--danger-soft);
        border-radius: var(--radius-md);
        margin-top: 4px;
      }
      .section-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .subcard {
        border: 1px solid var(--line);
        border-radius: 0;
        background: var(--panel-2);
        padding: 16px;
      }
      .list { display: grid; gap: 6px; margin-top: 10px; }
      .item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--item-bg);
        padding: 10px 12px;
      }
      .item-main { min-width: 0; }
      .item-title {
        overflow-wrap: anywhere;
        font-weight: 500;
        font-size: 0.88rem;
        letter-spacing: -0.01em;
      }
      .item-meta {
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 0.74rem;
        margin-top: 3px;
      }
      .failure-path { display: grid; gap: 6px; margin-top: 10px; }
      .failure-step {
        display: grid;
        grid-template-columns: 8px minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--item-bg);
        padding: 10px 12px;
      }
      .failure-step::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ok);
      }
      .failure-step.anchor {
        border-color: var(--danger-soft);
        background: var(--danger-soft);
      }
      .failure-step.anchor::before { background: var(--danger); }
      .failure-step .item-title { font-family: var(--font-mono); font-size: 0.82rem; }
      .impact {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        margin-top: 14px;
      }
      .impact .subcard { min-height: 96px; }
      .impact-value {
        margin-top: 8px;
        font: 500 1.6rem/1 var(--font-mono);
        letter-spacing: -0.04em;
        color: var(--text);
      }
      aside .panel { position: sticky; top: 18px; max-height: calc(100vh - 36px); display: flex; flex-direction: column; }
      #recent-list { overflow: auto; padding-right: 2px; }
      .recent-link {
        display: grid;
        gap: 6px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--item-bg);
        padding: 12px;
        margin-bottom: 6px;
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      .recent-link:hover { border-color: var(--line-strong); background: var(--row-hover); }
      .recent-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
      .empty, .error-box, .loading {
        border: 1px dashed var(--line-strong);
        border-radius: 0;
        color: var(--muted);
        padding: 28px;
        text-align: center;
        font-size: 0.92rem;
      }
      .empty strong { color: var(--text); display: block; margin-bottom: 6px; }
      .error-box { color: var(--danger); border-color: var(--danger-soft); background: var(--danger-soft); }
      .incident-strip {
        display: grid;
        gap: 10px;
        margin-bottom: 14px;
      }
      .incident-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
        gap: 8px;
      }
      .incident-card {
        display: grid;
        gap: 8px;
        min-width: 0;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: linear-gradient(135deg, var(--item-bg), transparent);
        padding: 12px;
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      .incident-card:hover { border-color: var(--line-strong); background: var(--row-hover); }
      .incident-title { display: flex; justify-content: space-between; gap: 8px; align-items: start; min-width: 0; }
      .incident-title strong { min-width: 0; overflow-wrap: anywhere; line-height: 1.25; }
      .incident-title .status { flex-shrink: 0; }
      .incident-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        min-width: 0;
      }
      .incident-meta span { min-width: 0; overflow-wrap: anywhere; }
      .incident-detail { display: grid; gap: 12px; }
      .evidence-list, .check-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
      .evidence-list li, .check-list li {
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--item-bg);
        padding: 10px 12px;
      }
      .disabled {
        display: grid;
        place-items: center;
        min-height: calc(100vh - 56px);
      }
      .disabled .card { width: min(680px, 100%); padding: 36px; text-align: center; }
      .disabled h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); }

      @media (max-width: 1080px) {
        .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .shell { grid-template-columns: 1fr; }
        aside .panel { position: static; max-height: none; }
      }
      @media (max-width: 720px) {
        body { padding: 14px; }
        .topbar, .kpis, .section-grid, .impact { grid-template-columns: 1fr; }
        .top-actions { justify-content: flex-start; }
        .spark { position: static; width: 100%; margin-top: 14px; }
        th:nth-child(3), td:nth-child(3) { display: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div id="live-region" class="sr-only" aria-live="polite"></div>
    <div id="app" class="app">
      <div class="loading">Loading dashboard…</div>
    </div>

    <script type="module">
      const windows = ["15m", "1h", "6h", "24h"];
      const state = {
        window: localStorage.getItem("waylog-dashboard-window") || "15m",
        capabilities: null,
        errors: null,
        recent: null,
        incidents: null,
        errorTrend: [],
        latencyTrend: [],
        timers: [],
        lastUpdated: null,
      };
      if (!windows.includes(state.window)) state.window = "15m";

      const nf = new Intl.NumberFormat();
      const msf = new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 });
      const dtf = new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
      const themeColors = { dark: "#0b0f17", light: "#f6f8fb" };

      class ApiError extends Error {
        constructor(status, code, message, detail) {
          super(message || code || "request failed");
          this.status = status;
          this.code = code || "";
          this.detail = detail || "";
        }
      }

      async function fetchJSON(url) {
        const res = await fetch(url, { credentials: "same-origin" });
        const text = await res.text();
        let body = null;
        if (text) {
          try { body = JSON.parse(text); } catch (_) {}
        }
        if (!res.ok) {
          const err = body && body.error ? body.error : {};
          throw new ApiError(res.status, err.code, err.message || text || res.statusText, err.detail);
        }
        return body || {};
      }

      function esc(value) {
        return String(value ?? "").replace(/[&<>"']/g, ch => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[ch]));
      }
      function shortID(id) {
        id = String(id || "");
        return id.length > 14 ? id.slice(0, 12) + "…" : id;
      }
      function ago(ts) {
        const d = Date.now() - new Date(ts).getTime();
        if (!Number.isFinite(d)) return "unknown";
        const sec = Math.round(d / 1000);
        if (sec < 60) return rtf.format(-sec, "second");
        const min = Math.round(sec / 60);
        if (min < 60) return rtf.format(-min, "minute");
        const hr = Math.round(min / 60);
        return rtf.format(-hr, "hour");
      }
      function statusClass(status) {
        return ["error", "timeout", "partial", "aborted", "suppressed", "ok"].includes(status) ? status : "ok";
      }
      function formatFamily(f) {
        return [f?.service, f?.step, f?.error_code].map(part => String(part || "").replaceAll(":", "\\:")).join(":");
      }
      function parseHash() {
        const raw = location.hash || "#/errors";
        const parts = raw.slice(2).split("/");
        return { screen: parts[0] || "errors", id: decodeURIComponent(parts.slice(1).join("/")) };
      }
      function params(obj) {
        const q = new URLSearchParams();
        Object.entries(obj).forEach(([k, v]) => {
          if (v !== undefined && v !== null && v !== "") q.set(k, v);
        });
        return q.toString();
      }
      function currentTheme() {
        return document.documentElement.dataset.theme === "light" ? "light" : "dark";
      }
      function applyTheme(theme) {
        const next = theme === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        document.documentElement.style.colorScheme = next;
        localStorage.setItem("waylog-dashboard-theme", next);
        const meta = document.getElementById("theme-color-meta");
        if (meta) meta.setAttribute("content", themeColors[next]);
      }
      function themeButtonLabel() {
        // Both literals appear in source so static tests (and screen readers)
        // can find "Light theme" / "Dark theme" regardless of current state.
        return currentTheme() === "light" ? "Switch to Dark theme" : "Switch to Light theme";
      }
      const ICON_SUN = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`;
      const ICON_MOON = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
      const ICON_REFRESH = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>`;
      function themeButtonIcon() { return currentTheme() === "light" ? ICON_MOON : ICON_SUN; }
      function pushTrend(arr, value) {
        arr.push(Number(value) || 0);
        if (arr.length > 18) arr.shift();
      }
      function percentile(values, p) {
        const xs = values.filter(Number.isFinite).sort((a, b) => a - b);
        if (!xs.length) return 0;
        return xs[Math.min(xs.length - 1, Math.floor((xs.length - 1) * p))];
      }
      function renderSparkline(values, cls = "") {
        const xs = values.length ? values : [0];
        const max = Math.max(1, ...xs);
        const w = 220, h = 58, step = xs.length > 1 ? w / (xs.length - 1) : w;
        const pts = xs.map((v, i) => [i * step, h - (v / max) * (h - 8) - 4]);
        const line = pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
        const area = `M0,${h} L${pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" L")} L${w},${h} Z`;
        return `<svg class="spark ${cls}" viewBox="0 0 ${w} ${h}" aria-hidden="true" focusable="false">
          <path class="area" d="${area}"></path><path class="line" d="M${line}"></path>
        </svg>`;
      }

      async function loadCapabilities() {
        state.capabilities = await fetchJSON("/v1/capabilities");
      }
      async function loadIncidents() {
        try {
          return await fetchJSON("/v1/incidents/active");
        } catch (err) {
          if (err.status === 404 || err.status === 503) return { incidents: [] };
          throw err;
        }
      }
      async function loadDashboardData() {
        const [errors, recent, incidents] = await Promise.all([
          fetchJSON("/v1/errors?" + params({ window: state.window, limit: 50 })),
          fetchJSON("/v1/traces/recent?" + params({ window: state.window, limit: 50, include_suppressed: true })),
          loadIncidents(),
        ]);
        state.errors = errors;
        state.recent = recent;
        state.incidents = incidents;
        const errorEvents = (errors.rows || []).reduce((sum, row) => sum + Number(row.count || 0), 0);
        const durations = (recent.traces || []).map(t => Number(t.duration_ms || 0));
        pushTrend(state.errorTrend, errorEvents);
        pushTrend(state.latencyTrend, percentile(durations, 0.95));
        state.lastUpdated = new Date();
      }

      function shell(content) {
        const route = parseHash();
        const errorsRows = state.errors?.rows || [];
        const traces = state.recent?.traces || [];
        const errorEvents = errorsRows.reduce((sum, row) => sum + Number(row.count || 0), 0);
        const durations = traces.map(t => Number(t.duration_ms || 0));
        const p50 = percentile(durations, 0.5);
        const p95 = percentile(durations, 0.95);
        return `
          <header class="topbar">
            <div class="brand">
              <span class="name">Waylog</span>
              <span class="div">/</span>
              <span class="ctx">Triage</span>
            </div>
            <div class="top-actions">
              <a class="topbar-link" href="http://localhost:9081/demo" target="_blank" rel="noopener">Demo controls</a>
              <span class="last-updated" id="last-updated">${state.lastUpdated ? "Updated " + dtf.format(state.lastUpdated) : "Not updated"}</span>
              <label>
                <span class="sr-only">Window</span>
                <select id="window-select" aria-label="Select time window">
                  ${windows.map(w => `<option value="${w}" ${w === state.window ? "selected" : ""}>${w}</option>`).join("")}
                </select>
              </label>
              <button id="refresh-btn" class="icon-btn" type="button" aria-label="Refresh">${ICON_REFRESH}</button>
              <button id="theme-toggle" class="icon-btn" type="button" aria-label="${themeButtonLabel()}">${themeButtonIcon()}</button>
            </div>
          </header>
          <p class="page-intro">Find the failure that started the cascade.</p>
          <section class="kpis" aria-label="Triage metrics">
            ${kpi("Error events", nf.format(errorEvents), "sum of current error families", renderSparkline(state.errorTrend))}
            ${kpi("Error families", nf.format(errorsRows.length), "grouped by service · step · code")}
            ${kpi("Completed traces", nf.format(traces.length), "recent sample from read API")}
            ${kpi("p50 / p95", `${msf.format(p50)} / ${msf.format(p95)} ms`, "recent trace durations", renderSparkline(state.latencyTrend, "latency"))}
          </section>
          <nav class="route-tabs" aria-label="Dashboard screens">
            ${tab("#/errors", "Errors", route.screen === "errors")}
            ${tab("#/explain/" + encodeURIComponent(firstTraceID()), "Explain", route.screen === "explain", !firstTraceID())}
            ${tab("#/blast/" + encodeURIComponent(firstFamily()), "Blast", route.screen === "blast", !firstFamily())}
          </nav>
          <main id="main" class="shell">
            <section>
              ${renderIncidentStrip()}
              <div class="card panel bracketed" aria-live="polite">${content}</div>
            </section>
            <aside>${renderRecent()}</aside>
          </main>
        `;
      }
      function kpi(label, value, sub, spark = "") {
        return `<article class="card kpi"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="sub">${esc(sub)}</div>${spark}</article>`;
      }
      function tab(href, label, active, disabled = false) {
        if (disabled) return `<span class="pill" aria-disabled="true">${esc(label)}</span>`;
        return `<a class="pill ${active ? "active" : ""}" href="${href}">${esc(label)}</a>`;
      }
      function firstFamily() {
        const row = state.errors?.rows?.[0];
        return row ? formatFamily(row.error_family) : "";
      }
      function firstTraceID() {
        return state.recent?.traces?.[0]?.trace_id || state.errors?.rows?.[0]?.sample_traces?.[0] || "";
      }

      function renderIncidentStrip() {
        const incidents = state.incidents?.incidents || [];
        if (!incidents.length) {
          return `<section class="card panel bracketed incident-strip" aria-labelledby="incidents-title">
            <div class="panel-head"><div><h2 id="incidents-title" class="panel-title">Active incidents</h2><div class="panel-sub">No active incidents.</div></div></div>
          </section>`;
        }
        return `<section class="card panel bracketed incident-strip" aria-labelledby="incidents-title">
          <div class="panel-head"><div><h2 id="incidents-title" class="panel-title">Active incidents</h2><div class="panel-sub">${nf.format(incidents.length)} incident${incidents.length === 1 ? "" : "s"} detected</div></div></div>
          <div class="incident-grid">${incidents.map(incident => `
            <a class="incident-card" href="#/incident/${encodeURIComponent(incident.incident_id)}">
              <div class="incident-title">
                <strong>${esc(formatFamily(incident.error_family))}</strong>
                <span class="status ${statusClass(incident.status)}">${esc(incident.status)}</span>
              </div>
              <div class="item-meta incident-meta">
                <span>${esc(incident.cause || "unknown")}</span>
                <span>${esc(incident.confidence || "low")} confidence</span>
                <span>severity ${nf.format(incident.severity || 0)}</span>
              </div>
              <div class="item-meta incident-meta">
                <span>${nf.format(incident.affected_requests || 0)} requests</span>
                <span>${nf.format(incident.affected_services || 0)} services</span>
                <span>started ${esc(ago(incident.started_at))}</span>
              </div>
            </a>`).join("")}</div>
        </section>`;
      }

      function renderRecent() {
        return `<section class="card panel bracketed" aria-labelledby="recent-title">
          <div class="panel-head"><div><h2 id="recent-title" class="panel-title">Recent requests</h2><div class="panel-sub">Polls every 5s</div></div></div>
          <div id="recent-list">${recentItemsHTML()}</div>
        </section>`;
      }
      function recentItemsHTML() {
        const list = state.recent?.traces || [];
        return list.length ? list.map(trace => `
          <a class="recent-link" href="#/explain/${encodeURIComponent(trace.trace_id)}">
            <div class="recent-top">
              <span class="mono">${esc(shortID(trace.trace_id))}</span>
              <span class="status ${statusClass(trace.status)}">${esc(trace.status)}</span>
            </div>
            <div class="item-meta">${esc((trace.services || []).join(" → ") || "unknown service")}</div>
            <div class="item-meta">${esc(ago(trace.ts_start))} · ${msf.format(Number(trace.duration_ms || 0))} ms</div>
          </a>`).join("") : `<div class="empty">No recent requests yet. <a class="sample-link" href="http://localhost:9081/demo">Run a scenario</a> to populate this view.</div>`;
      }

      function renderErrors() {
        const rows = state.errors?.rows || [];
        if (!rows.length) {
          return `<div class="panel-head"><div><h2 class="panel-title">Top error families</h2><div class="panel-sub">${esc(state.window)} window</div></div></div>
            <div class="empty">
              <strong>No failures in this window.</strong>
              <div class="item-meta">Run the checkout outage demo to see a failure path and impact analysis. Open <a class="sample-link" href="http://localhost:9081/demo">Demo controls</a> and trigger <span class="mono">payment_502</span>.</div>
            </div>`;
        }
        return `<div class="panel-head"><div><h2 class="panel-title">Top error families</h2><div class="panel-sub">Grouped by service, step, and code</div></div></div>
          <div class="table-wrap"><table>
            <thead><tr><th>Family</th><th>Count</th><th>Affected</th><th>Samples</th></tr></thead>
            <tbody>${rows.map(row => {
              const family = formatFamily(row.error_family);
              return `<tr>
                <td><a class="family" href="#/blast/${encodeURIComponent(family)}"><strong>${esc(family)}</strong><span class="muted">open blast radius</span></a></td>
                <td class="mono">${nf.format(row.count || 0)}</td>
                <td><span class="mono">${nf.format(row.affected_traces || 0)}</span><div class="faint">${row.affected_users == null ? "users unknown" : nf.format(row.affected_users) + " users"}</div></td>
                <td><div class="samples">${(row.sample_traces || []).map(id => `<a class="sample-link" href="#/explain/${encodeURIComponent(id)}">${esc(shortID(id))}</a>`).join("") || "<span class='faint'>none</span>"}</div></td>
              </tr>`;
            }).join("")}</tbody>
          </table></div>`;
      }

      async function renderExplain(id) {
        if (!id) return shell(`<div class="empty">Choose a trace or event to explain.</div>`);
        let story;
        try {
          story = await fetchJSON("/v1/traces/story?" + params({ event_id: id }));
        } catch (err) {
          if (err.status === 404 || err.code === "not_found") {
            story = await fetchJSON("/v1/traces/story?" + params({ trace_id: id }));
          } else {
            throw err;
          }
        }
        const anchor = story.anchor ? `${story.anchor.step} → ${story.anchor.error_code}` : "no failure anchor";
        return shell(`<div class="story-grid">
          <div class="hero">
            <div class="panel-sub">first observable failing step</div>
            <h2>First failing step</h2>
            <div class="hero-anchor">${esc(anchor)}</div>
            <div class="muted">${esc(story.service || "unknown")} · ${esc(story.route || "unknown route")} · linkage ${esc(story.linkage || "unknown")}</div>
          </div>
          <div class="section-grid">
            ${storyCard("Failure path", renderSteps(story.path || [], story.anchor))}
            ${storyCard("Logs", renderLogs(story.logs || []))}
            ${storyCard("Downstream", renderDownstream(story.downstream || []))}
            ${storyCard("Trace", `<div class="list"><div class="item"><div class="item-main"><div class="item-title mono">${esc(story.trace_id)}</div><div class="item-meta">status ${esc(story.status)}</div></div></div></div>`)}
          </div>
        </div>`);
      }
      function storyCard(title, body) {
        return `<section class="subcard"><h3 class="panel-title">${esc(title)}</h3>${body}</section>`;
      }
      function renderSteps(steps, anchor) {
        if (!steps.length) return `<div class="empty">No contributing steps.</div>`;
        return `<div class="failure-path">${steps.map((step, index) => {
          const isAnchor = anchor && step.name === anchor.step && (!anchor.error_code || !step.error_code || step.error_code === anchor.error_code);
          const indent = Math.min(index * 18, 54);
          return `<div class="failure-step ${isAnchor ? "anchor" : ""}" style="margin-left:${indent}px">
          <div class="item-main"><div class="item-title">${esc(step.name)}${isAnchor ? " ← first failure" : ""}</div><div class="item-meta">${esc(step.error_msg || step.error_code || "completed")}</div></div>
          <div><span class="status ${statusClass(step.status)}">${esc(step.status)}</span><div class="item-meta mono">${msf.format(step.duration_ms || 0)} ms</div></div>
        </div>`;
        }).join("")}</div>`;
      }
      function renderLogs(logs) {
        if (!logs.length) return `<div class="empty">No warning/error logs in the contributing window.</div>`;
        return `<div class="list">${logs.map(log => `<div class="item">
          <div class="item-main"><div class="item-title">${esc(log.msg)}</div><div class="item-meta">${esc(log.step || "request")}</div></div>
          <div class="mono">${esc(log.level)}</div>
        </div>`).join("")}</div>`;
      }
      function renderDownstream(edges) {
        if (!edges.length) return `<div class="empty">No downstream calls recorded.</div>`;
        return `<div class="list">${edges.map(edge => `<div class="item">
          <div class="item-main"><div class="item-title">${esc(edge.step)} → ${esc(edge.service)}</div><div class="item-meta">${esc(edge.endpoint || "")}</div></div>
        </div>`).join("")}</div>`;
      }

      async function renderBlast(key) {
        if (!key) return shell(`<div class="empty">Choose an error family to inspect impact.</div>`);
        const decoded = key;
        const q = decoded.includes(":") || decoded.includes("\\:") ? { error_family: decoded, window: state.window } : { error_code: decoded, window: state.window };
        const blast = await fetchJSON("/v1/blast_radius?" + params(q));
        return shell(`<div class="panel-head"><div><h2 class="panel-title">Blast radius</h2><div class="panel-sub">${esc(blast.view_mode || "unknown")} · ${esc(displayBlastKey(blast.key))}</div></div></div>
          <section class="impact">
            ${impact("Affected requests", blast.affected_requests)}
            ${impact("Affected users", blast.affected_users == null ? "unknown" : blast.affected_users)}
            ${impact("Affected services", blast.affected_services)}
            ${impact("Window", blast.window || state.window)}
          </section>
          <div class="section-grid" style="margin-top:12px">
            ${storyCard("Top services", `<div class="list">${(blast.top_services || []).map(s => `<div class="item"><div class="item-title">${esc(s)}</div></div>`).join("") || "<div class='empty'>No services affected.</div>"}</div>`)}
            ${storyCard("Sample traces", `<div class="list">${(blast.sample_traces || []).map(id => `<a class="item" href="#/explain/${encodeURIComponent(id)}"><span class="item-title mono">${esc(shortID(id))}</span></a>`).join("") || "<div class='empty'>No sample traces.</div>"}</div>`)}
          </div>`);
      }

      async function renderIncident(id) {
        if (!id) return shell(`<div class="empty">Choose an incident to inspect.</div>`);
        const resp = await fetchJSON("/v1/incidents/" + encodeURIComponent(id));
        const incident = resp.incident || {};
        return shell(`<div class="incident-detail">
          <div class="hero">
            <div class="panel-sub">incident summary</div>
            <h2>${esc(formatFamily(incident.error_family))}</h2>
            <div class="hero-anchor">${esc(incident.cause || "unknown")} · ${esc(incident.confidence || "low")} confidence</div>
            <div class="muted">${esc(incident.status || "unknown")} · severity ${nf.format(incident.severity || 0)} · started ${esc(ago(incident.started_at))}</div>
          </div>
          <section class="impact">
            ${impact("Affected requests", incident.affected_requests || 0)}
            ${impact("Affected users", incident.affected_users == null ? "unknown" : incident.affected_users)}
            ${impact("Affected services", incident.affected_services || 0)}
            ${impact("Lift", Number(incident.lift || 0).toFixed(2) + "x")}
          </section>
          <div class="section-grid">
            ${storyCard("Evidence", renderEvidence(incident.evidence || []))}
            ${storyCard("Next checks", renderChecks(incident.next_checks || []))}
            ${storyCard("Sample traces", renderIncidentSamples(incident.sample_traces || []))}
            ${storyCard("Instrumentation warnings", renderWarnings(incident.instrumentation_warnings || []))}
          </div>
        </div>`);
      }
      function renderEvidence(items) {
        if (!items.length) return `<div class="empty">No incident evidence attached.</div>`;
        return `<ul class="evidence-list">${items.map(item => `<li>
          <div class="item-title">${esc(item.title || item.kind || "evidence")}</div>
          <div class="item-meta">${esc(item.kind || "unknown")}${item.detail ? " · " + esc(item.detail) : ""}${item.service ? " · " + esc(item.service) : ""}</div>
        </li>`).join("")}</ul>`;
      }
      function renderChecks(items) {
        if (!items.length) return `<div class="empty">No next checks generated.</div>`;
        return `<ul class="check-list">${items.map(check => `<li>${esc(check)}</li>`).join("")}</ul>`;
      }
      function renderIncidentSamples(ids) {
        if (!ids.length) return `<div class="empty">No sample traces attached.</div>`;
        return `<div class="list">${ids.map(id => `<a class="item" href="#/explain/${encodeURIComponent(id)}"><span class="item-title mono">${esc(shortID(id))}</span><span class="item-meta">open explain</span></a>`).join("")}</div>`;
      }
      function renderWarnings(items) {
        if (!items.length) return `<div class="empty">No instrumentation warnings.</div>`;
        return `<ul class="check-list">${items.map(warning => `<li>${esc(warning)}</li>`).join("")}</ul>`;
      }
      function impact(label, value) {
        return `<article class="subcard"><div class="panel-sub">${esc(label)}</div><div class="impact-value">${esc(typeof value === "number" ? nf.format(value) : value)}</div></article>`;
      }
      function displayBlastKey(key) {
        if (!key) return "";
        return key.service && key.step ? formatFamily({ service: key.service, step: key.step, error_code: key.error_code }) : key.error_code;
      }

      async function renderCurrentScreen() {
        const route = parseHash();
        try {
          if (!state.errors || !state.recent) await loadDashboardData();
          if (route.screen === "explain") {
            document.getElementById("app").innerHTML = await renderExplain(route.id);
          } else if (route.screen === "blast") {
            document.getElementById("app").innerHTML = await renderBlast(route.id);
          } else if (route.screen === "incident") {
            document.getElementById("app").innerHTML = await renderIncident(route.id);
          } else {
            document.getElementById("app").innerHTML = shell(renderErrors());
          }
          bindShell();
        } catch (err) {
          renderError(err);
        }
      }
      function renderError(err) {
        const message = err.status === 401 ? "Session expired. Sign in again to continue." : (err.detail || err.message || "Dashboard request failed.");
        document.getElementById("app").innerHTML = shell(`<div class="error-box">${esc(message)}</div>`);
        bindShell();
      }
      function renderDisabled() {
        document.getElementById("app").innerHTML = `<main class="disabled">
          <section class="card">
            <div class="eyebrow" style="justify-content:center"><span class="dot" style="background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)"></span><span class="num">[setup]</span> required</div>
            <h1>This dashboard requires WAYLOG_V2_READS=true.</h1>
            <p class="muted">Restart the ingest server with v2 read APIs enabled, then refresh this page.</p>
          </section>
        </main>`;
      }
      function bindShell() {
        const select = document.getElementById("window-select");
        if (select) select.addEventListener("change", async event => {
          state.window = event.target.value;
          localStorage.setItem("waylog-dashboard-window", state.window);
          await refreshAll();
        });
        const refresh = document.getElementById("refresh-btn");
        if (refresh) refresh.addEventListener("click", refreshAll);
        const themeToggle = document.getElementById("theme-toggle");
        if (themeToggle) themeToggle.addEventListener("click", () => {
          applyTheme(currentTheme() === "light" ? "dark" : "light");
          themeToggle.innerHTML = themeButtonIcon();
          themeToggle.setAttribute("aria-label", themeButtonLabel());
        });
      }
      async function refreshAll() {
        const recent = document.getElementById("recent-list");
        const scrollTop = recent ? recent.scrollTop : 0;
        await loadDashboardData();
        await renderCurrentScreen();
        const nextRecent = document.getElementById("recent-list");
        if (nextRecent) nextRecent.scrollTop = scrollTop;
      }
      function reportPollError(err) {
        const live = document.getElementById("live-region");
        if (live) live.textContent = "Dashboard refresh failed: " + (err.detail || err.message || "request failed");
      }
      function startPolling() {
        state.timers.forEach(clearInterval);
        state.timers = [
          setInterval(() => refreshAll().catch(reportPollError), 5000),
        ];
      }

      window.addEventListener("hashchange", renderCurrentScreen);
      try {
        await loadCapabilities();
        if (!state.capabilities?.v2_reads?.enabled) {
          renderDisabled();
        } else {
          await loadDashboardData();
          if (!location.hash) location.hash = "#/errors";
          await renderCurrentScreen();
          startPolling();
        }
      } catch (err) {
        document.getElementById("app").innerHTML = `<div class="error-box">${esc(err.message || "Unable to load dashboard.")}</div>`;
      }
    </script>
  </body>
</html>
