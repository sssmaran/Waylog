services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.7
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.7.7
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  ingest:
    build:
      context: .
      target: ingest
    ports:
      - "8080:8080"
    env_file:
      - ${ENV_FILE:-deploy/dev.env}
    environment:
      INGEST_ADDR: ":8080"
      SNAPSHOT_PATH: /data/graph_snapshot.json
      EVENT_LOG_DIR: /data/eventlog
      LOG_LEVEL: info
      CORS_ORIGIN: "*"
      WAYLOG_API_KEY: ${WAYLOG_API_KEY:-}
    volumes:
      - ingest-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  bridge:
    build:
      context: .
      target: bridge
    depends_on:
      kafka:
        condition: service_healthy
      ingest:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: wide_events
      INGEST_URL: http://ingest:8080/v1/events
      WAYLOG_API_KEY: ${WAYLOG_API_KEY:-}
      DLQ_DIR: /data/dlq
      LOG_LEVEL: info
    volumes:
      - bridge-data:/data

  api-gateway:
    build:
      context: .
      target: api-gateway
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9081:9081"
    environment:
      CHECKOUT_URL: http://checkout-demo:9082
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: wide_events

  checkout-demo:
    build:
      context: .
      target: checkout-demo
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      PAYMENT_URL: http://payment-demo:9083
      DB_URL: http://db-demo:9084
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: wide_events

  payment-demo:
    build:
      context: .
      target: payment-demo
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: wide_events

  db-demo:
    build:
      context: .
      target: db-demo
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: wide_events

volumes:
  ingest-data:
  bridge-data:
