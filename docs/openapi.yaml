openapi: 3.0.3
info:
  title: Waylog API
  version: 0.1.0
servers:
  - url: /
paths:
  /v1/events:
    post:
      summary: Emit an event
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WideEvent'
      responses:
        '202':
          description: Accepted
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/graph/stats:
    get:
      summary: Graph statistics
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/requests/explain:
    post:
      summary: Explain a request or trace
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request_id:
                  type: string
                trace_id:
                  type: string
      responses:
        '200':
          description: Explanation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/trace/{trace_id}/summary:
    get:
      summary: Trace summary
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: trace_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trace summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/trace/{trace_id}/graph:
    get:
      summary: Trace graph
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: trace_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trace graph
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/failures:
    post:
      summary: Failed requests
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Failures
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/patterns:
    post:
      summary: Failure patterns
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Patterns
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/blast-radius:
    post:
      summary: Blast radius
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Blast radius
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/failure-chain:
    post:
      summary: Failure chain
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Failure chain
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/query:
    post:
      summary: Graph query
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Query result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/compare-windows:
    post:
      summary: Compare windows
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Comparison result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/insights:
    post:
      summary: Insights
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Insights
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    WideEvent:
      type: object
      required:
        - schema_version
        - event_name
        - timestamp
        - user
        - request
        - system
        - outcome
        - metrics
      properties:
        schema_version:
          type: string
        event_name:
          type: string
        timestamp:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserContext'
        request:
          $ref: '#/components/schemas/RequestContext'
        system:
          $ref: '#/components/schemas/SystemContext'
        outcome:
          $ref: '#/components/schemas/OutcomeContext'
        error:
          $ref: '#/components/schemas/ErrorContext'
        metrics:
          $ref: '#/components/schemas/MetricsContext'
    UserContext:
      type: object
      required: [id, tier, region, vip]
      properties:
        id: { type: string }
        tier: { type: string }
        region: { type: string }
        vip: { type: boolean }
    RequestContext:
      type: object
      required: [trace_id, flow, feature_flags]
      properties:
        trace_id: { type: string }
        span_id: { type: string }
        parent_span_id: { type: string }
        flow: { type: string }
        feature_flags:
          type: array
          items: { type: string }
    SystemContext:
      type: object
      required: [service, version, deployment_id, env]
      properties:
        service: { type: string }
        version: { type: string }
        deployment_id: { type: string }
        env: { type: string }
        downstream_service: { type: string }
        caller_service: { type: string }
    OutcomeContext:
      type: object
      required: [success, status_code, kind]
      properties:
        success: { type: boolean }
        status_code: { type: integer }
        kind: { type: string }
    ErrorContext:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    MetricsContext:
      type: object
      required: [latency_ms]
      properties:
        latency_ms: { type: integer }
