openapi: 3.0.3
info:
  title: Waylog API
  description: |
    HTTP API for the Waylog ingest server.

    Write endpoints require authentication via API key.
    Read endpoints are open (protected by CORS only).
  version: 0.1.0
servers:
  - url: /
paths:
  /v1/events:
    post:
      summary: Ingest a WideEvent
      description: |
        Accepts a WideEvent JSON payload, validates it against the schema,
        and ingests it into the graph.
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WideEvent'
      responses:
        '202':
          description: Accepted
        '400':
          description: Invalid request (validation failure)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized (missing or invalid API key)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: Method Not Allowed
        '413':
          description: Request Entity Too Large

  /v1/traces/story:
    get:
      summary: Trace story narrative
      description: |
        Returns a human-readable story narrative for the given trace,
        built from the graph's span and service data.
      parameters:
        - in: query
          name: trace_id
          required: true
          schema:
            type: string
          description: The trace ID to build a story for
      responses:
        '200':
          description: Trace story
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Missing trace_id query parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Trace not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '503':
          description: Service Unavailable (graph not ready)

  /v1/traces/recent:
    get:
      summary: Recent traces
      description: Returns a list of recent trace summaries, ordered by time.
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Maximum number of traces to return (default 20, max 100)
      responses:
        '200':
          description: Array of recent trace summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '503':
          description: Service Unavailable (graph not ready)

  /v1/overview:
    get:
      summary: System overview
      description: |
        Returns an overview of the system including service counts,
        request rates, error rates, and top errors within the given window.
      parameters:
        - in: query
          name: window
          required: false
          schema:
            type: string
            default: 5m
          description: Time window as a Go duration string (e.g. "5m", "1h")
      responses:
        '200':
          description: System overview stats
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '503':
          description: Service Unavailable (graph not ready)

  /healthz:
    get:
      summary: Health check
      description: Returns 200 OK when the server is running.
      responses:
        '200':
          description: OK

components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key passed via the X-API-Key header
    BearerAuth:
      type: http
      scheme: bearer
      description: API key passed via the Authorization header as a Bearer token
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    WideEvent:
      type: object
      required:
        - schema_version
        - event_name
        - timestamp
        - user
        - request
        - system
        - outcome
        - metrics
      properties:
        schema_version:
          type: string
        event_name:
          type: string
        timestamp:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserContext'
        request:
          $ref: '#/components/schemas/RequestContext'
        system:
          $ref: '#/components/schemas/SystemContext'
        outcome:
          $ref: '#/components/schemas/OutcomeContext'
        error:
          $ref: '#/components/schemas/ErrorContext'
        metrics:
          $ref: '#/components/schemas/MetricsContext'
    UserContext:
      type: object
      required: [id, tier, region, vip]
      properties:
        id: { type: string }
        tier: { type: string }
        region: { type: string }
        vip: { type: boolean }
    RequestContext:
      type: object
      required: [trace_id, flow, feature_flags]
      properties:
        trace_id: { type: string }
        span_id: { type: string }
        parent_span_id: { type: string }
        flow: { type: string }
        feature_flags:
          type: array
          items: { type: string }
    SystemContext:
      type: object
      required: [service, version, deployment_id, env]
      properties:
        service: { type: string }
        version: { type: string }
        deployment_id: { type: string }
        env: { type: string }
        downstream_service: { type: string }
        caller_service: { type: string }
    OutcomeContext:
      type: object
      required: [success, status_code, kind]
      properties:
        success: { type: boolean }
        status_code: { type: integer }
        kind: { type: string }
    ErrorContext:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    MetricsContext:
      type: object
      required: [latency_ms]
      properties:
        latency_ms: { type: integer }
